function buildInvoiceText(group, config, mode, groupDiscountPercent) {
  const lines = [];
  const sales = group.sales.slice().sort((a, b) => new Date(a.date) - new Date(b.date));
  const rate = num(config.rateValue);
  const fmt = (usdVal) => (mode === "usd" ? usd(usdVal) : mode === "bs" ? bs(usdVal * rate) : usd(usdVal) + " / " + bs(usdVal * rate));
  lines.push(config.businessName);
  lines.push(sales.length > 1 ? "Estado de cuenta" : "Factura #" + sales[0].invoiceNumber);
  lines.push("Generado: " + fmtDateTime(nowIso()));
  lines.push("Cliente: " + group.clientName);
  sales.forEach((sale) => {
    lines.push("");
    const pendiente = num(sale.totalUsd) - num(sale.paidAmountUsd) > 0.005;
    lines.push("— Factura #" + sale.invoiceNumber + " · " + fmtDateTime(sale.date) + " · Estado: " + (pendiente ? "Pendiente" : "Pagada"));
    sortedItems(sale.items).forEach((it) => {
      const sub = it.qty * it.unitPriceUsd;
      if (mode === "usd") lines.push(it.name + "  x" + it.qty + "  " + usd(it.unitPriceUsd) + "  =  " + usd(sub));
      else if (mode === "bs") lines.push(it.name + "  x" + it.qty + "  " + bs(it.unitPriceUsd * rate) + "  =  " + bs(sub * rate) + "  (" + usd(sub) + ")");
      else lines.push(it.name + "  x" + it.qty + "  =  " + usd(sub) + " / " + bs(sub * rate));
    });
    const rawTotal = num(sale.subtotalUsd != null ? sale.subtotalUsd : sale.totalUsd);
    lines.push("Subtotal: " + fmt(rawTotal));
    if (num(sale.discountUsd) > 0.005) lines.push("Descuento (" + sale.discountPercent + "%): -" + fmt(sale.discountUsd));
    lines.push("Total factura: " + fmt(sale.totalUsd));
    lines.push("Total abono: " + fmt(sale.paidAmountUsd));
    lines.push("Total a pagar: " + fmt(num(sale.totalUsd) - num(sale.paidAmountUsd)));
  });
  lines.push("");
  const gPct = num(groupDiscountPercent);
  const gDiscUsd = gPct > 0 ? num(group.totalUsd) * (gPct / 100) : 0;
  const gFinal = Math.max(0, num(group.totalUsd) - gDiscUsd);
  lines.push("TOTAL: " + fmt(group.totalUsd));
  if (gDiscUsd > 0.005) { lines.push("Descuento factura completa (" + gPct + "%): -" + fmt(gDiscUsd)); lines.push("TOTAL CON DESCUENTO: " + fmt(gFinal)); }
  lines.push("Total abono: " + fmt(group.paidUsd));
  lines.push("Total a pagar: " + fmt(Math.max(0, gFinal - num(group.paidUsd))));
  return lines.join("\n");
}

function buildInvoiceImage(group, config, mode, groupDiscountPercent) {
  const sales = group.sales.slice().sort((a, b) => new Date(a.date) - new Date(b.date));
  const rate = num(config.rateValue);
  const rows = [];
  sales.forEach((sale) => {
    const pendiente = num(sale.totalUsd) - num(sale.paidAmountUsd) > 0.005;
    rows.push({ header: true, text: "Factura #" + sale.invoiceNumber + " · " + fmtDateTime(sale.date), estado: pendiente ? "Pendiente" : "Pagada", estadoColor: pendiente ? "#C6412B" : "#2E7D45" });
    rows.push({ colHeads: true });
    sortedItems(sale.items).forEach((it) => {
      const priceLine = mode === "bs" ? bs(it.unitPriceUsd * rate) : usd(it.unitPriceUsd);
      const subLine = mode === "bs" ? bs(it.qty * it.unitPriceUsd * rate) : usd(it.qty * it.unitPriceUsd);
      rows.push({
        name: it.name, qty: it.qty, priceLine, subLine, both: mode === "both",
        bothPrice: bs(it.unitPriceUsd * rate), bothSub: bs(it.qty * it.unitPriceUsd * rate),
      });
    });
    if (num(sale.discountUsd) > 0.005) {
      const discLine = mode === "bs" ? bs(sale.discountUsd * rate) : usd(sale.discountUsd);
      rows.push({ discount: true, text: "Descuento (" + sale.discountPercent + "%): -" + discLine });
    }
    const rawTotal = num(sale.subtotalUsd != null ? sale.subtotalUsd : sale.totalUsd);
    const fmtLine = (v) => (mode === "bs" ? bs(v * rate) : usd(v));
    const porPagarSale = num(sale.totalUsd) - num(sale.paidAmountUsd);
    rows.push({ subtotal: true, text: "Subtotal: " + fmtLine(rawTotal) });
    rows.push({ saletotal: true, text: "Total factura: " + fmtLine(sale.totalUsd) });
    rows.push({ subtotal: true, text: "Total abono: " + fmtLine(sale.paidAmountUsd) });
    rows.push({ saletotal: true, text: "Total a pagar: " + fmtLine(porPagarSale), color: pendiente ? "#C6412B" : "#2E7D45" });
  });

  const width = 760, pad = 34, rowH = 70, sectionH = 40, colH = 36, discH = 30, subH = 30, totH = 34, headerH = 140, footerH = 230;
  const height = headerH + rows.reduce((a, r) => a + (r.header ? sectionH : r.colHeads ? colH : r.discount ? discH : r.subtotal ? subH : r.saletotal ? totH : rowH), 0) + footerH;
  const scale = 2; // dibuja al doble de resolución para que se vea nítida al compartir/hacer zoom
  const canvas = document.createElement("canvas");
  canvas.width = width * scale; canvas.height = Math.max(height, 300) * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, width, canvas.height / scale);
  ctx.textBaseline = "top";
  const SANS = "Helvetica, Arial, sans-serif", MONO = "Menlo, Consolas, 'Courier New', monospace";
  const fit = (text, maxW) => { let t = String(text); while (t.length > 1 && ctx.measureText(t).width > maxW) t = t.slice(0, -1); return t.length < String(text).length ? t.trim() + "…" : t; };

  ctx.textAlign = "center";
  ctx.font = "800 32px " + SANS; ctx.fillStyle = "#000000";
  ctx.fillText(config.businessName, width / 2, pad);
  ctx.font = "600 16px " + SANS; ctx.fillStyle = "#333333";
  ctx.fillText((sales.length > 1 ? "Estado de cuenta" : "Factura #" + sales[0].invoiceNumber) + " · generado " + fmtDateTime(nowIso()), width / 2, pad + 44);
  ctx.textAlign = "left";
  ctx.font = "800 21px " + SANS; ctx.fillStyle = "#000000";
  ctx.fillText("Cliente: " + group.clientName, pad, pad + 80);

  const colProducto = pad, colCant = width * 0.47, colPrecio = width * 0.6, colSubtotal = width - pad;

  let y = headerH;
  rows.forEach((r) => {
    if (r.header) {
      ctx.fillStyle = "#BBBBBB"; ctx.fillRect(pad, y, width - 2 * pad, 2);
      ctx.font = "800 17px " + SANS; ctx.fillStyle = "#222222"; ctx.textAlign = "left";
      ctx.fillText(r.text, pad, y + 12);
      ctx.textAlign = "right"; ctx.font = "800 17px " + SANS; ctx.fillStyle = r.estadoColor;
      ctx.fillText("Estado: " + r.estado, width - pad, y + 12);
      y += sectionH; return;
    }
    if (r.colHeads) {
      ctx.font = "800 15px " + SANS; ctx.fillStyle = "#333333";
      ctx.textAlign = "left"; ctx.fillText("Producto", colProducto, y);
      ctx.textAlign = "center"; ctx.fillText("Cant.", colCant, y);
      ctx.textAlign = "left"; ctx.fillText("Precio", colPrecio, y);
      ctx.textAlign = "right"; ctx.fillText("Subtotal", colSubtotal, y);
      y += colH;
      ctx.fillStyle = "#DDDDDD"; ctx.fillRect(pad, y - 6, width - 2 * pad, 1);
      return;
    }
    if (r.discount) {
      ctx.textAlign = "right"; ctx.font = "italic 700 16px " + SANS; ctx.fillStyle = "#9A5F10";
      ctx.fillText(r.text, colSubtotal, y + 4);
      y += discH; return;
    }
    if (r.subtotal) {
      ctx.textAlign = "right"; ctx.font = "700 17px " + SANS; ctx.fillStyle = "#333333";
      ctx.fillText(r.text, colSubtotal, y + 4);
      y += subH; return;
    }
    if (r.saletotal) {
      ctx.textAlign = "right"; ctx.font = "800 19px " + SANS; ctx.fillStyle = r.color || "#000000";
      ctx.fillText(r.text, colSubtotal, y + 4);
      y += totH; return;
    }
    ctx.font = "800 20px " + SANS; ctx.fillStyle = "#000000";
    ctx.textAlign = "left"; ctx.fillText(fit(r.name, colCant - 36 - colProducto), colProducto, y + 4);
    ctx.textAlign = "center"; ctx.font = "800 20px " + MONO; ctx.fillText(String(r.qty), colCant, y + 4);
    ctx.textAlign = "left"; ctx.font = "800 20px " + MONO; ctx.fillStyle = "#000000";
    ctx.fillText(r.priceLine, colPrecio, y + 4);
    ctx.textAlign = "right";
    ctx.fillText(r.subLine, colSubtotal, y + 4);
    if (r.both) {
      ctx.font = "700 16px " + MONO; ctx.fillStyle = "#333333";
      ctx.textAlign = "left"; ctx.fillText(r.bothPrice, colPrecio, y + 32);
      ctx.textAlign = "right"; ctx.fillText(r.bothSub, colSubtotal, y + 32);
    }
    y += rowH;
  });

  ctx.fillStyle = "#000000"; ctx.fillRect(pad, y + 6, width - 2 * pad, 3);
  y += 28;
  ctx.textAlign = "left";
  ctx.font = "900 26px " + SANS; ctx.fillStyle = "#000000";
  ctx.fillText("TOTAL", pad, y);
  ctx.textAlign = "right";
  ctx.font = "900 26px " + MONO;
  const totalLine = mode === "bs" ? bs(group.totalUsd * rate) : usd(group.totalUsd);
  ctx.fillText(totalLine, width - pad, y);
  if (mode === "both") { ctx.font = "800 18px " + MONO; ctx.fillStyle = "#333333"; ctx.fillText(bs(group.totalUsd * rate), width - pad, y + 34); }
  y += mode === "both" ? 66 : 42;
  const gPct = num(groupDiscountPercent);
  const gDiscUsd = gPct > 0 ? num(group.totalUsd) * (gPct / 100) : 0;
  const gFinal = Math.max(0, num(group.totalUsd) - gDiscUsd);
  if (gDiscUsd > 0.005) {
    ctx.textAlign = "right"; ctx.font = "italic 700 17px " + SANS; ctx.fillStyle = "#9A5F10";
    ctx.fillText("Descuento factura completa (" + gPct + "%): -" + (mode === "bs" ? bs(gDiscUsd * rate) : usd(gDiscUsd)), width - pad, y);
    y += 30;
    ctx.font = "900 21px " + SANS; ctx.fillStyle = "#000000";
    ctx.fillText("TOTAL CON DESCUENTO: " + (mode === "bs" ? bs(gFinal * rate) : usd(gFinal)), width - pad, y);
    y += 36;
  }
  ctx.textAlign = "left";
  ctx.font = "800 19px " + SANS; ctx.fillStyle = "#2E7D45";
  ctx.fillText("Total abono: " + (mode === "bs" ? bs(group.paidUsd * rate) : usd(group.paidUsd)), pad, y);
  y += 32;
  const porPagar = Math.max(0, gFinal - num(group.paidUsd));
  ctx.font = "900 22px " + SANS; ctx.fillStyle = porPagar > 0.005 ? "#C6412B" : "#2E7D45";
  ctx.fillText("Total a pagar: " + (mode === "bs" ? bs(porPagar * rate) : usd(porPagar)), pad, y);

  return canvas;
}

function InvoiceModal({ group, config, products, onClose, notify }) {
  const [mode, setMode] = useState("both"); // usd | bs | both
  const [groupDiscountEnabled, setGroupDiscountEnabled] = useState(false);
  const [groupDiscountPercent, setGroupDiscountPercent] = useState("");
  const groupDiscountUsd = groupDiscountEnabled ? num(group.totalUsd) * (num(groupDiscountPercent) / 100) : 0;
  const groupFinalTotal = Math.max(0, num(group.totalUsd) - groupDiscountUsd);
  const sales = group.sales.slice().sort((a, b) => new Date(a.date) - new Date(b.date));
  const text = buildInvoiceText(group, config, mode, groupDiscountEnabled ? groupDiscountPercent : 0);
  const rate = num(config.rateValue);
  const copy = async () => { try { await navigator.clipboard.writeText(text); notify("Factura copiada."); } catch (e) { notify("No se pudo copiar."); } };
  const sendWa = () => {
    const phone = waPhone(group.clientPhone);
    if (!phone) { notify("Este cliente no tiene teléfono registrado."); return; }
    window.open("https://wa.me/" + phone + "?text=" + encodeURIComponent(text), "_blank");
  };
  const [generating, setGenerating] = useState(false);
  const [invoiceImg, setInvoiceImg] = useState(null); // dataURL para vista previa si no hay menú de compartir
  const shareImage = async () => {
    setGenerating(true);
    try {
      const canvas = buildInvoiceImage(group, config, mode, groupDiscountEnabled ? groupDiscountPercent : 0);
      await new Promise((resolve) => {
        canvas.toBlob(async (blob) => {
          const file = new File([blob], "factura.png", { type: "image/png" });
          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({ files: [file], title: config.businessName, text: reminderMessage(config) });
            } catch (e) { /* el usuario cerró el menú de compartir, no hacemos nada más */ }
          } else {
            setInvoiceImg(canvas.toDataURL("image/png"));
          }
          resolve();
        }, "image/png", 1);
      });
    } catch (e) {
      notify("No se pudo generar la imagen de la factura.");
    }
    setGenerating(false);
  };
  return (
    <Modal title={sales.length > 1 ? "Estado de cuenta — " + group.clientName : "Factura #" + sales[0].invoiceNumber} onClose={onClose} wide>
      <div
        className="rounded-lg p-4 mb-3 invoice-print"
        style={{
          background: "#FFFFFF", border: "1px solid #DDDDDD", color: "#111111",
          "--ink": "#111111", "--ink-soft": "#555555", "--kraft-dark": "#DDDDDD", "--cream": "#FFFFFF",
        }}
      >
        <div className="text-center mb-3">
          <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, color: "#000000" }} className="text-lg">{config.businessName}</div>
          <div className="text-xs" style={{ color: "var(--ink-soft)" }}>{sales.length > 1 ? sales.length + " compras registradas" : "Factura #" + sales[0].invoiceNumber} · generado {fmtDateTime(nowIso())}</div>
        </div>
        <div className="text-sm mb-3"><b>Cliente:</b> {group.clientName}</div>

        {sales.map((sale) => {
          const rawTotal = num(sale.subtotalUsd != null ? sale.subtotalUsd : sale.totalUsd);
          const fmtLine = (v) => (mode === "bs" ? bs(v * rate) : usd(v));
          const pendiente = num(sale.totalUsd) - num(sale.paidAmountUsd) > 0.005;
          return (
            <div key={sale.id} className="mb-3 pb-3" style={{ borderBottom: "1px dashed var(--kraft-dark)" }}>
              <div className="flex items-center justify-between text-xs mb-1" style={{ color: "var(--ink-soft)" }}>
                <span>Factura #{sale.invoiceNumber} · {fmtDateTime(sale.date)}</span>
                <span style={{ color: pendiente ? "var(--stamp)" : "var(--limon)", fontWeight: 600 }}>Estado: {pendiente ? "Pendiente" : "Pagada"}</span>
              </div>
              <table className="ledger w-full">
                <thead><tr><th>Producto</th><th>Cant.</th><th>Precio</th><th>Subtotal</th></tr></thead>
                <tbody>
                  {sortedItems(sale.items).map((it, idx) => (
                    <tr key={idx}>
                      <td>{it.name}</td><td>{it.qty}</td>
                      <td style={{ fontFamily: "var(--font-mono)" }}>{mode === "bs" ? bs(it.unitPriceUsd * rate) : usd(it.unitPriceUsd)}{mode === "both" && <div style={{ fontSize: 11, color: "var(--ink-soft)", whiteSpace: "nowrap" }}>{bs(it.unitPriceUsd * rate)}</div>}</td>
                      <td style={{ fontFamily: "var(--font-mono)" }}>{mode === "bs" ? bs(it.qty * it.unitPriceUsd * rate) : usd(it.qty * it.unitPriceUsd)}{mode === "both" && <div style={{ fontSize: 11, color: "var(--ink-soft)", whiteSpace: "nowrap" }}>{bs(it.qty * it.unitPriceUsd * rate)}</div>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div className="text-xs text-right mt-1">
                <div style={{ color: "var(--ink-soft)" }}>Subtotal: {fmtLine(rawTotal)}</div>
                {num(sale.discountUsd) > 0.005 && <div style={{ color: "var(--caramel)" }}>Descuento ({sale.discountPercent}%): -{fmtLine(sale.discountUsd)}</div>}
                <div className="font-semibold" style={{ color: "var(--ink)" }}>Total factura: {fmtLine(sale.totalUsd)}</div>
                <div style={{ color: "var(--limon)" }}>Total abono: {fmtLine(sale.paidAmountUsd)}</div>
                <div className="font-semibold" style={{ color: pendiente ? "var(--stamp)" : "var(--limon)" }}>Total a pagar: {fmtLine(num(sale.totalUsd) - num(sale.paidAmountUsd))}</div>
              </div>
            </div>
          );
        })}

        <div className="flex justify-between items-center pt-2" style={{ borderTop: "1px solid var(--kraft-dark)" }}>
          <span className="text-sm font-medium">Total</span>
          <div className="text-right" style={{ fontFamily: "var(--font-mono)" }}>
            {groupDiscountEnabled && groupDiscountUsd > 0 && <div className="text-xs" style={{ color: "var(--ink-soft)", textDecoration: "line-through" }}>{usd(group.totalUsd)}</div>}
            {mode !== "bs" && <div className="text-lg">{usd(groupFinalTotal)}</div>}
            {mode !== "usd" && <div style={{ fontSize: mode === "bs" ? 18 : 12, color: mode === "bs" ? "var(--ink)" : "var(--ink-soft)" }}>{bs(groupFinalTotal * rate)}</div>}
          </div>
        </div>
        {groupDiscountEnabled && groupDiscountUsd > 0 && (
          <div className="text-xs text-right" style={{ color: "var(--caramel)" }}>Descuento factura completa ({num(groupDiscountPercent)}%): -{mode === "bs" ? bs(groupDiscountUsd * rate) : usd(groupDiscountUsd)}</div>
        )}
        <div className="text-xs mt-2 text-right" style={{ color: "var(--limon)" }}>Total abono: {mode === "bs" ? bs(group.paidUsd * rate) : usd(group.paidUsd)}</div>
        <div className="text-xs mt-1 text-right font-semibold" style={{ color: group.debt > 0.005 ? "var(--stamp)" : "var(--limon)" }}>
          Total a pagar: {mode === "bs" ? bs(Math.max(0, groupFinalTotal - group.paidUsd) * rate) : usd(Math.max(0, groupFinalTotal - group.paidUsd))}
        </div>
      </div>

      <div className="rounded-md p-3 mb-3" style={{ background: "var(--kraft)", color: "var(--ink)" }}>
        <label className="flex items-center gap-2 text-sm mb-2">
          <input type="checkbox" checked={groupDiscountEnabled} onChange={(e) => setGroupDiscountEnabled(e.target.checked)} />
          ¿Aplicar descuento a la factura completa?
        </label>
        {groupDiscountEnabled && (
          <div className="flex items-center gap-2">
            <TextInput type="number" min="0" max="100" step="1" value={groupDiscountPercent} onChange={(e) => setGroupDiscountPercent(e.target.value)} placeholder="10" style={{ width: 90 }} />
            <span className="text-sm">% de descuento sobre el total general</span>
          </div>
        )}
      </div>

      <Field label="Moneda de la factura">
        <Select value={mode} onChange={(e) => setMode(e.target.value)}>
          <option value="usd">Solo dólares</option>
          <option value="bs">Solo bolívares (con referencia en USD)</option>
          <option value="both">Bolívares y dólares por separado</option>
        </Select>
      </Field>
      <div className="flex flex-wrap justify-end gap-3 mt-2">
        <Btn variant="ghost" onClick={copy} className="text-base py-2.5 px-4"><Copy size={20} />Copiar factura</Btn>
        <Btn variant="ghost" onClick={sendWa} className="text-base py-2.5 px-4"><MessageCircle size={20} />Enviar texto por WhatsApp</Btn>
        <Btn variant="limon" disabled={generating} onClick={shareImage} className="text-base py-2.5 px-4"><Camera size={20} />{generating ? "Generando…" : "Compartir imagen"}</Btn>
      </div>
      {invoiceImg && (
        <div className="mt-3 text-center">
          <img src={invoiceImg} alt="Factura" className="w-full rounded-lg" style={{ border: "1px solid var(--kraft-dark)", maxWidth: 340, margin: "0 auto" }} />
          <p className="text-xs mt-2 font-medium" style={{ color: "var(--caramel)" }}>Mantén presionada la imagen y elige "Compartir" o "Enviar a WhatsApp" — no hace falta descargarla.</p>
        </div>
      )}
    </Modal>
  );
}

function ReturnModal({ sale, onConfirm, onClose }) {
  const [qty, setQty] = useState(() => Object.fromEntries(sale.items.map((it) => [it.productId, 0])));
  const setQtyFor = (pid, max, val) => {
    let v = Math.round(num(val));
    if (v < 0) v = 0; if (v > max) v = max;
    setQty((prev) => ({ ...prev, [pid]: v }));
  };
  const totalRefund = sale.items.reduce((a, it) => a + num(qty[it.productId] || 0) * num(it.unitPriceUsd), 0);
  const anySelected = Object.values(qty).some((q) => num(q) > 0);
  return (
    <Modal title={"Registrar devolución — factura #" + sale.invoiceNumber} onClose={onClose} wide>
      <p className="text-xs mb-3" style={{ color: "var(--ink-soft)" }}>Indica cuántas unidades de cada producto devuelve el cliente. Esas unidades regresarán al inventario y se descontarán del monto de la venta.</p>
      <table className="ledger w-full mb-3">
        <thead><tr><th>Producto</th><th>Vendido</th><th>A devolver</th><th>Monto</th></tr></thead>
        <tbody>
          {sale.items.map((it) => (
            <tr key={it.productId}>
              <td>{it.name}</td>
              <td style={{ fontFamily: "var(--font-mono)" }}>{it.qty}</td>
              <td><TextInput type="number" min="0" max={it.qty} value={qty[it.productId]} onChange={(e) => setQtyFor(it.productId, it.qty, e.target.value)} style={{ width: 80 }} /></td>
              <td style={{ fontFamily: "var(--font-mono)" }}>{usd(num(qty[it.productId] || 0) * num(it.unitPriceUsd))}</td>
            </tr>
          ))}
        </tbody>
      </table>
      <div className="flex items-center justify-between p-3 rounded-md mb-3" style={{ background: "var(--kraft)" }}>
        <span className="text-sm">Monto a descontar</span>
        <span style={{ fontFamily: "var(--font-mono)" }} className="text-lg">{usd(totalRefund)}</span>
      </div>
      <div className="flex justify-end gap-2">
        <Btn variant="ghost" onClick={onClose}>Cancelar</Btn>
        <Btn variant="stamp" disabled={!anySelected} onClick={() => onConfirm(sale.id, qty)}><RotateCcw size={16} />Confirmar devolución</Btn>
      </div>
    </Modal>
  );
}

function AddToTabModal({ group, products, config, onConfirm, onClose, notify }) {
  const openSales = group.sales.filter((s) => s.status === "credito" && num(s.totalUsd) - num(s.paidAmountUsd) > 0.005).sort((a, b) => new Date(b.date) - new Date(a.date));
  const [targetId, setTargetId] = useState(openSales[0] ? openSales[0].id : "");
  const [items, setItems] = useState([]);
  const quantities = Object.fromEntries(items.map((i) => [i.productId, i.qty]));
  const setQty = (product, newQty) => {
    let q = Math.round(num(newQty));
    if (q < 0) q = 0;
    if (q > num(product.stock)) q = num(product.stock);
    setItems((prev) => {
      const idx = prev.findIndex((i) => i.productId === product.id);
      if (q === 0) return prev.filter((i) => i.productId !== product.id);
      const entry = { productId: product.id, name: product.name, qty: q, unitPriceUsd: num(product.priceUsd), unitCostUsd: num(product.costUsd) };
      if (idx >= 0) return prev.map((i, j) => (j === idx ? entry : i));
      return [...prev, entry];
    });
  };
  const total = items.reduce((a, i) => a + i.qty * i.unitPriceUsd, 0);
  return (
    <Modal title={"Agregar producto — " + group.clientName} onClose={onClose} wide>
      {openSales.length > 1 && (
        <Field label="Agregar a la factura">
          <Select value={targetId} onChange={(e) => setTargetId(e.target.value)}>
            {openSales.map((s) => <option key={s.id} value={s.id}>Factura #{s.invoiceNumber} (debe {usd(num(s.totalUsd) - num(s.paidAmountUsd))})</option>)}
          </Select>
        </Field>
      )}
      <Field label="Productos">
        <ProductPicker products={products} quantities={quantities} onQtyChange={setQty} rate={num(config.rateValue)} />
      </Field>
      <div className="flex items-center justify-between p-3 rounded-md mb-3" style={{ background: "var(--kraft)" }}>
        <span className="text-sm">Se agregará a la deuda</span>
        <span className="text-right"><div style={{ fontFamily: "var(--font-mono)" }} className="text-lg">{usd(total)}</div><div style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--ink-soft)" }}>{bs(total * num(config.rateValue))}</div></span>
      </div>
      <div className="flex justify-end gap-2">
        <Btn variant="ghost" onClick={onClose}>Cancelar</Btn>
        <Btn variant="stamp" disabled={items.length === 0 || !targetId} onClick={() => onConfirm(targetId, items)}><Check size={16} />Guardar</Btn>
      </div>
    </Modal>
  );
}

function EditDiscountModal({ sale, onSave, onClose }) {
  const [enabled, setEnabled] = useState(num(sale.discountPercent) > 0);
  const [percent, setPercent] = useState(sale.discountPercent || "");
  return (
    <Modal title={"Descuento — Factura #" + sale.invoiceNumber} onClose={onClose}>
      <label className="flex items-center gap-2 text-sm mb-3">
        <input type="checkbox" checked={enabled} onChange={(e) => setEnabled(e.target.checked)} />
        ¿Aplicar descuento a esta factura?
      </label>
      {enabled && (
        <Field label="Porcentaje de descuento">
          <TextInput type="number" min="0" max="100" step="1" value={percent} onChange={(e) => setPercent(e.target.value)} placeholder="10" style={{ width: 100 }} />
        </Field>
      )}
      <div className="flex justify-end gap-2 mt-2">
        <Btn variant="ghost" onClick={onClose}>Cancelar</Btn>
        <Btn variant="stamp" onClick={() => onSave(sale.id, enabled, percent)}><Check size={16} />Guardar</Btn>
      </div>
    </Modal>
  );
}

function EditNoteModal({ sale, onSave, onClose }) {
  const [text, setText] = useState(sale.notes && sale.notes.length > 0 ? sale.notes[sale.notes.length - 1].text : "");
  return (
    <Modal title={"Descripción — Factura #" + sale.invoiceNumber} onClose={onClose}>
      <Field label="Descripción"><TextInput value={text} onChange={(e) => setText(e.target.value)} placeholder="Ej: pagar el 15" /></Field>
      <div className="flex justify-end gap-2 mt-2">
        <Btn variant="ghost" onClick={onClose}>Cancelar</Btn>
        <Btn variant="stamp" onClick={() => onSave(sale.id, text)}><Check size={16} />Guardar</Btn>
      </div>
    </Modal>
  );
}

function SettingsModal({ config, setConfig, onClose }) {
  const [name, setName] = useState(config.businessName);
  const save = () => {
    setConfig((prev) => ({ ...prev, businessName: name.trim() || prev.businessName }));
    onClose();
  };
  return (
    <Modal title="Ajustes del negocio" onClose={onClose}>
      <Field label="Nombre del negocio"><TextInput value={name} onChange={(e) => setName(e.target.value)} /></Field>
      <p className="text-xs mb-2" style={{ color: "var(--ink-soft)" }}>Para cambiar tu correo o clave de acceso, usa la opción "has olvidado tu contraseña" en la pantalla de inicio de sesión, o contáctame para agregar esa opción aquí.</p>
      <div className="flex justify-end gap-2 mt-2">
        <Btn variant="ghost" onClick={onClose}>Cancelar</Btn>
        <Btn variant="stamp" onClick={save}><Check size={16} />Guardar</Btn>
      </div>
    </Modal>
  );
}
