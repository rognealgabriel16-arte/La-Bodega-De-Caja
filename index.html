const parseBcvText = (t) => { const m = t.match(/USD\D{0,80}?(\d{1,3}(?:\.\d{3})*,\d{2,8}|\d+[.,]\d{2,8})/); return m ? parseVeNumber(m[1]) : 0; };
const jsonRate = (data) => {
  const keys = ["promedio", "price", "precio", "tasa", "venta", "valor", "usd", "USD", "rate"];
  const walk = (o, depth) => {
    if (!o || typeof o !== "object" || depth > 5) return 0;
    for (const k of keys) {
      if (k in o) {
        const v = o[k];
        const n = typeof v === "number" ? v : typeof v === "string" ? parseVeNumber(v) : typeof v === "object" ? walk(v, depth + 1) : 0;
        if (n > 1) return n;
      }
    }
    for (const k of Object.keys(o)) { if (o[k] && typeof o[k] === "object") { const n = walk(o[k], depth + 1); if (n > 1) return n; } }
    return 0;
  };
  return walk(data, 0);
};

// Persistencia en Supabase. Cada tabla (products, clients, sales, counts) guarda
// una fila por registro (columna jsonb "data"); app_config guarda una sola fila por usuario.
async function loadTable(userId, table, fallback) {
  try {
    if (table === "app_config") {
      const { data, error } = await sb.from("app_config").select("data").eq("user_id", userId).maybeSingle();
      if (error || !data) return fallback;
      return { ...fallback, ...data.data };
    }
    const { data, error } = await sb.from(table).select("data").eq("user_id", userId);
    if (error || !data) return fallback;
    return data.map((row) => row.data);
  } catch (e) {
    console.error("no se pudo cargar", table, e);
    return fallback;
  }
}
async function saveTable(userId, table, value) {
  try {
    if (table === "app_config") {
      await sb.from("app_config").upsert({ user_id: userId, data: value, updated_at: new Date().toISOString() });
      return;
    }
    // reemplaza todas las filas del usuario para esta tabla (sencillo y confiable para el tamaño de datos de un negocio pequeño)
    await sb.from(table).delete().eq("user_id", userId);
    if (value.length > 0) {
      await sb.from(table).insert(value.map((obj) => ({ id: obj.id, user_id: userId, data: obj })));
    }
  } catch (e) {
    console.error("no se pudo guardar", table, e);
  }
}

  const [err, setErr] = useState(""); const [info, setInfo] = useState(""); const [busy, setBusy] = useState(false);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = sb.auth.onAuthStateChange((event, s) => {
      setSession(s);
      if (event === "PASSWORD_RECOVERY") setRecovering(true);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  if (session === undefined) {
    return <div className="flex items-center justify-center py-20" style={{ color: "var(--ink-soft)", background: "var(--kraft)", minHeight: "100vh" }}>Cargando…</div>;
  }
  if (session && !recovering) return children(session.user.id);

  const go = (m) => { setMode(m); setErr(""); setInfo(""); };
  const niceError = (error) => {
    const msg = String((error && error.message) || "");
    if (/rate|seconds|too many|limit/i.test(msg)) return "Espera un momento antes de pedir otro código e inténtalo de nuevo.";
    return msg || "Ocurrió un error. Inténtalo de nuevo.";
  };

  const submitCreate = async () => {
    setErr("");
    if (!email.trim() || p.length < 6) { setErr("Escribe un correo válido y una clave de al menos 6 caracteres."); return; }
    if (p !== p2) { setErr("Las claves no coinciden."); return; }
    setBusy(true);
    const { error } = await sb.auth.signUp({ email: email.trim(), password: p });
    setBusy(false);
    if (error) setErr(error.message);
  };
  const submitLogin = async () => {
    setErr("");
    setBusy(true);
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: p });
    setBusy(false);
    if (error) setErr("Correo o clave incorrectos.");
  };
  const sendCode = async () => {
    setErr(""); setInfo("");
    if (!email.trim()) { setErr("Escribe el correo con el que creaste tu cuenta."); return; }
    setBusy(true);
    const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.href.split("#")[0].split("?")[0] });
    setBusy(false);
    if (error) { setErr(niceError(error)); return; }
    setMode("code");
    setInfo("Te enviamos un correo a " + email.trim() + ". Ábrelo y toca el enlace \"Reset password\": te llevará aquí para crear tu clave nueva. Revisa también la carpeta de spam. (Si tu correo trae un código en vez de enlace, escríbelo abajo.)");
  };
  const verifyCode = async () => {
    setErr("");
    if (!code.trim()) { setErr("Escribe el código que llegó a tu correo."); return; }
    setBusy(true);
    const { error } = await sb.auth.verifyOtp({ email: email.trim(), token: code.trim(), type: "recovery" });
    setBusy(false);
    if (error) { setErr("Código incorrecto o vencido. Pide uno nuevo."); return; }
    setRecovering(true);
  };
  const saveNewPassword = async () => {
    setErr("");
    if (p.length < 6) { setErr("La clave debe tener al menos 6 caracteres."); return; }
    if (p !== p2) { setErr("Las claves no coinciden."); return; }
    setBusy(true);
    const { error } = await sb.auth.updateUser({ password: p });
    setBusy(false);
    if (error) { setErr(niceError(error)); return; }
    setP(""); setP2(""); setCode("");
    setRecovering(false);
  };

  const title = recovering ? "Crea tu nueva clave" : mode === "login" ? "Inicia sesión para administrar tu negocio" : mode === "create" ? "Crea tu cuenta para empezar" : "Recupera tu clave";

  return (
    <div style={{ fontFamily: "var(--font-body)", background: "var(--kraft)", minHeight: "100vh", color: "var(--ink)" }} className="flex items-center justify-center p-4">
      <GlobalStyle />
      <div className="w-full max-w-sm rounded-lg p-6" style={{ background: "var(--cream)", border: "1px solid var(--kraft-dark)" }}>
        <div className="flex flex-col items-center mb-4">
          <div className="w-12 h-12 rounded-full flex items-center justify-center mb-2" style={{ background: "var(--ink)" }}>
            <Lock size={20} color="var(--cream)" />
          </div>
          <h1 style={{ fontFamily: "var(--font-display)" }} className="text-xl text-center">La Bodeguita De Caja</h1>
          <p className="text-xs text-center" style={{ color: "var(--ink-soft)" }}>{title}</p>
        </div>

        {recovering ? (
          <div>
            <Field label="Nueva clave (mínimo 6 caracteres)"><TextInput type="password" value={p} onChange={(e) => setP(e.target.value)} /></Field>
            <Field label="Confirmar nueva clave"><TextInput type="password" value={p2} onChange={(e) => setP2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && saveNewPassword()} /></Field>
            {err && <p className="text-xs mb-2" style={{ color: "var(--stamp)" }}>{err}</p>}
            <Btn variant="stamp" disabled={busy} onClick={saveNewPassword} className="w-full justify-center"><Check size={16} />{busy ? "Guardando…" : "Guardar nueva clave y entrar"}</Btn>
          </div>
        ) : mode === "forgot" ? (
          <div>
            <p className="text-xs mb-3" style={{ color: "var(--ink-soft)" }}>Escribe tu correo y te enviaremos un enlace para crear una clave nueva.</p>
            <Field label="Correo"><TextInput type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="tucorreo@ejemplo.com" onKeyDown={(e) => e.key === "Enter" && sendCode()} /></Field>
            {err && <p className="text-xs mb-2" style={{ color: "var(--stamp)" }}>{err}</p>}
            <Btn variant="stamp" disabled={busy} onClick={sendCode} className="w-full justify-center"><Check size={16} />{busy ? "Enviando…" : "Enviarme el enlace"}</Btn>
            <button onClick={() => go("login")} className="text-xs mt-3 w-full text-center" style={{ color: "var(--ink-soft)" }}>Volver a iniciar sesión</button>
          </div>
        ) : mode === "code" ? (
          <div>
            {info && <p className="text-xs mb-3" style={{ color: "var(--ink-soft)" }}>{info}</p>}
            <Field label="Código (solo si tu correo trae uno)"><TextInput inputMode="numeric" value={code} onChange={(e) => setCode(e.target.value)} placeholder="123456" onKeyDown={(e) => e.key === "Enter" && verifyCode()} /></Field>
            {err && <p className="text-xs mb-2" style={{ color: "var(--stamp)" }}>{err}</p>}
            <Btn variant="stamp" disabled={busy} onClick={verifyCode} className="w-full justify-center"><Check size={16} />{busy ? "Verificando…" : "Verificar código"}</Btn>
            <button onClick={sendCode} disabled={busy} className="text-xs mt-3 w-full text-center" style={{ color: "var(--ink-soft)" }}>¿No llegó? Enviar otro correo</button>
            <button onClick={() => go("login")} className="text-xs mt-2 w-full text-center" style={{ color: "var(--ink-soft)" }}>Volver a iniciar sesión</button>
          </div>
        ) : (
          <div>
            <Field label="Correo"><TextInput type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="tucorreo@ejemplo.com" /></Field>
            <Field label="Clave (mínimo 6 caracteres)"><TextInput type="password" value={p} onChange={(e) => setP(e.target.value)} onKeyDown={(e) => e.key === "Enter" && (mode === "login" ? submitLogin() : submitCreate())} /></Field>
            {mode === "create" && <Field label="Confirmar clave"><TextInput type="password" value={p2} onChange={(e) => setP2(e.target.value)} /></Field>}
            {err && <p className="text-xs mb-2" style={{ color: "var(--stamp)" }}>{err}</p>}
            {mode === "login" ? (
              <Btn variant="stamp" disabled={busy} onClick={submitLogin} className="w-full justify-center"><Check size={16} />{busy ? "Entrando…" : "Iniciar sesión"}</Btn>
            ) : (
              <Btn variant="stamp" disabled={busy} onClick={submitCreate} className="w-full justify-center"><Check size={16} />{busy ? "Creando…" : "Crear cuenta y entrar"}</Btn>
            )}
            {mode === "login" && <button onClick={() => go("forgot")} className="text-sm mt-3 w-full text-center font-medium" style={{ color: "var(--stamp)" }}>¿Olvidaste tu clave?</button>}
            <button onClick={() => go(mode === "login" ? "create" : "login")} className="text-xs mt-3 w-full text-center" style={{ color: "var(--ink-soft)" }}>
              {mode === "login" ? "¿No tienes cuenta? Créala aquí" : "¿Ya tienes cuenta? Inicia sesión"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function Workspace({ userId }) {
  const [loading, setLoading] = useState(true);
  const [config, setConfig] = useState({ businessName: "La Bodeguita De Caja", rateValue: 0, rateDate: today(), rateManual: true, theme: "light", nextInvoiceNumber: 1 });
  const [products, setProducts] = useState([]);
  const [clients, setClients] = useState([]);
  const [sales, setSales] = useState([]);
  const [counts, setCounts] = useState([]);
  const loaded = useRef(false);

  useEffect(() => {
    (async () => {
      const [p, c, s, ct, cfg] = await Promise.all([
        loadTable(userId, K.products, []), loadTable(userId, K.clients, []), loadTable(userId, K.sales, []), loadTable(userId, K.counts, []), loadTable(userId, K.config, null),
      ]);
      setProducts(p); setClients(c); setSales(s); setCounts(ct);
      if (cfg) setConfig((prev) => ({ ...prev, ...cfg }));
      loaded.current = true;
      setLoading(false);
    })();
  }, [userId]);

  useEffect(() => { if (loaded.current) saveTable(userId, K.products, products); }, [products]);
  useEffect(() => { if (loaded.current) saveTable(userId, K.clients, clients); }, [clients]);
  useEffect(() => { if (loaded.current) saveTable(userId, K.sales, sales); }, [sales]);
  useEffect(() => { if (loaded.current) saveTable(userId, K.counts, counts); }, [counts]);
  useEffect(() => { if (loaded.current) saveTable(userId, K.config, config); }, [config]);

  if (loading) {
    return <div className="flex items-center justify-center py-20" style={{ color: "var(--ink-soft)", background: "var(--kraft)", minHeight: "100vh" }}>Cargando tu negocio…</div>;
  }

  return (
    <App
      products={products} setProducts={setProducts}
      clients={clients} setClients={setClients}
      sales={sales} setSales={setSales}
      counts={counts} setCounts={setCounts}
      config={config} setConfig={setConfig}
      onLogout={async () => {
        try { await sb.auth.signOut({ scope: "local" }); } catch (e) {}
        try { Object.keys(localStorage).filter((k) => k.indexOf("sb-") === 0).forEach((k) => localStorage.removeItem(k)); } catch (e) {}
        window.location.reload();
      }}
    />
  );
}

function Root() {
  return <LoginGate>{(userId) => <Workspace userId={userId} />}</LoginGate>;
}

function App({ products, setProducts, clients, setClients, sales, setSales, counts, setCounts, config, setConfig, onLogout }) {
  const [tab, setTab] = useState("dashboard");
  const [mobileMenu, setMobileMenu] = useState(false);
  const [notice, setNotice] = useState(null);
  const [confirmDialog, setConfirmDialog] = useState(null); // { message, onConfirm }
  const notify = (msg) => setNotice(msg);
  const askConfirm = (message, onConfirm) => setConfirmDialog({ message, onConfirm });

  const mKey = monthKey(nowIso());
  const salesThisMonth = useMemo(() => sales.filter((s) => monthKey(s.date) === mKey), [sales, mKey]);
  const settledThisMonth = useMemo(() => salesThisMonth.filter(isSettled), [salesThisMonth]);

  const costoInventario = useMemo(() => products.reduce((a, p) => a + num(p.stock) * num(p.costUsd), 0), [products]);
  const valorInventario = useMemo(() => products.reduce((a, p) => a + num(p.stock) * num(p.priceUsd), 0), [products]);
  const gananciaPotencial = valorInventario - costoInventario;

  const inversionMes = useMemo(() => settledThisMonth.reduce((a, s) => a + num(s.totalCostUsd), 0), [settledThisMonth]);
  const gananciaMes = useMemo(
    () => settledThisMonth.reduce((a, s) => a + (num(s.totalUsd) - num(s.totalCostUsd)), 0),
    [settledThisMonth]
  );
  const ventasMesTotal = useMemo(() => settledThisMonth.reduce((a, s) => a + num(s.totalUsd), 0), [settledThisMonth]);

  const balanceCaja = useMemo(
    () => sales.reduce((a, s) => a + (s.status === "pagado" ? num(s.totalUsd) : num(s.paidAmountUsd)), 0),
    [sales]
  );
  const ventasPagadas = useMemo(() => sales.filter(isSettled).sort((a, b) => new Date(b.date) - new Date(a.date)), [sales]);

  const productoRanking = useMemo(() => {
    const acc = {};
    salesThisMonth.forEach((s) => s.items.forEach((it) => {
      acc[it.productId] = acc[it.productId] || { name: it.name, qty: 0, revenue: 0 };
      acc[it.productId].qty += num(it.qty);
      acc[it.productId].revenue += num(it.qty) * num(it.unitPriceUsd);
    }));
    return Object.values(acc).sort((a, b) => b.qty - a.qty);
  }, [salesThisMonth]);
  const productoEstrella = productoRanking[0] || null;

  const deudas = useMemo(() => sales
    .filter((s) => s.status === "credito")
    .map((s) => ({ ...s, remaining: num(s.totalUsd) - num(s.paidAmountUsd) }))
    .filter((s) => s.remaining > 0.005)
    .sort((a, b) => new Date(b.date) - new Date(a.date)), [sales]);

  const deudaTotal = useMemo(() => deudas.reduce((a, d) => a + d.remaining, 0), [deudas]);
  const stockBajo = useMemo(() => products.filter((p) => num(p.minStock) > 0 && num(p.stock) <= num(p.minStock)), [products]);

  const clientGroups = useMemo(() => {
    const map = new Map();
    sales.forEach((s) => {
      const key = s.clientId || ("occ-" + s.id);
      if (!map.has(key)) map.set(key, { key, clientId: s.clientId, clientName: s.clientName, clientPhone: s.clientPhone, sales: [] });
      map.get(key).sales.push(s);
    });
    return Array.from(map.values()).map((g) => {
      const sorted = g.sales.slice().sort((a, b) => new Date(b.date) - new Date(a.date));
      const totalUsd = sorted.reduce((a, s) => a + num(s.totalUsd), 0);
      const paidUsd = sorted.reduce((a, s) => a + num(s.paidAmountUsd), 0);
      return { ...g, sales: sorted, totalUsd, paidUsd, debt: Math.max(0, totalUsd - paidUsd), lastDate: sorted[0].date };
    }).sort((a, b) => new Date(b.lastDate) - new Date(a.lastDate));
  }, [sales]);
  const debtGroups = useMemo(() => clientGroups.filter((g) => g.debt > 0.005), [clientGroups]);
  const ventasGroups = useMemo(() => {
    const map = new Map();
    sales.filter(isSettled).forEach((s) => {
      const key = s.clientId || ("occ-" + s.id);
      if (!map.has(key)) map.set(key, { key, clientId: s.clientId, clientName: s.clientName, clientPhone: s.clientPhone, sales: [] });
      map.get(key).sales.push(s);
    });
    return Array.from(map.values()).map((g) => {
      const sorted = g.sales.slice().sort((a, b) => new Date(b.date) - new Date(a.date));
      const totalUsd = sorted.reduce((a, s) => a + num(s.totalUsd), 0);
      return { ...g, sales: sorted, totalUsd, paidUsd: totalUsd, debt: 0, lastDate: sorted[0].date };
    }).sort((a, b) => new Date(b.lastDate) - new Date(a.lastDate));
  }, [sales]);

  const last6MonthsData = useMemo(() => {
    const out = []; const d = new Date();
    for (let i = 5; i >= 0; i--) {
      const dt = new Date(d.getFullYear(), d.getMonth() - i, 1);
      const key = dt.toISOString().slice(0, 7);
      const monthSales = sales.filter((s) => monthKey(s.date) === key && isSettled(s));
      const revenue = monthSales.reduce((a, s) => a + num(s.totalUsd), 0);
      const profit = monthSales.reduce((a, s) => a + (num(s.totalUsd) - num(s.totalCostUsd)), 0);
      out.push({ label: MONTHS[dt.getMonth()], ventas: Math.round(revenue * 100) / 100, ganancia: Math.round(profit * 100) / 100 });
    }
    return out;
  }, [sales]);

  const topProductosData = useMemo(() => {
    const acc = {};
    settledThisMonth.forEach((s) => s.items.forEach((it) => { acc[it.name] = (acc[it.name] || 0) + num(it.qty) * num(it.unitPriceUsd); }));
    return Object.entries(acc).map(([name, revenue]) => ({ name, revenue: Math.round(revenue * 100) / 100 })).sort((a, b) => b.revenue - a.revenue).slice(0, 5);
  }, [salesThisMonth]);

  // product CRUD
  const [productModal, setProductModal] = useState(null);
  const saveProduct = (data) => {
    if (data.id) setProducts((prev) => prev.map((p) => (p.id === data.id ? data : p)));
    else setProducts((prev) => [...prev, { ...data, id: uid() }]);
    setProductModal(null);
  };
  const deleteProduct = (id) => askConfirm("¿Eliminar este producto del inventario?", () => setProducts((prev) => prev.filter((p) => p.id !== id)));

  // client CRUD
  const [clientModal, setClientModal] = useState(null);
  const saveClient = (data) => {
    if (data.id) setClients((prev) => prev.map((c) => (c.id === data.id ? data : c)));
    else setClients((prev) => [...prev, { ...data, id: uid() }]);
    setClientModal(null);
  };
  const deleteClient = (id) => askConfirm("¿Eliminar este cliente?", () => setClients((prev) => prev.filter((c) => c.id !== id)));
  const clientDebt = (id) => deudas.filter((d) => d.clientId === id).reduce((a, d) => a + d.remaining, 0);
  const clientBought = (id) => sales.filter((s) => s.clientId === id).reduce((a, s) => a + num(s.totalUsd), 0);

  // sale registration
  const [saleModal, setSaleModal] = useState(false);
  const [saleClient, setSaleClient] = useState("");
  const [saleStatus, setSaleStatus] = useState("pagado");
  const [saleItems, setSaleItems] = useState([]);
  const [saleDescription, setSaleDescription] = useState("");
  const [saleTabTarget, setSaleTabTarget] = useState("");
  const openTabsForClient = useMemo(
    () => (saleClient ? sales.filter((s) => s.clientId === saleClient && s.status === "credito" && num(s.totalUsd) - num(s.paidAmountUsd) > 0.005).sort((a, b) => new Date(b.date) - new Date(a.date)) : []),
    [saleClient, sales]
  );
  const openSaleModal = (defaultStatus) => { setSaleClient(""); setSaleStatus(defaultStatus || "pagado"); setSaleItems([]); setSaleTabTarget(""); setSaleDescription(""); setSaleDiscountEnabled(false); setSaleDiscountPercent(""); setSaleModal(true); };
  useEffect(() => {
    if (saleStatus === "credito" && openTabsForClient.length > 0) setSaleTabTarget(openTabsForClient[0].id);
    else setSaleTabTarget("");
  }, [saleClient, saleStatus]); // eslint-disable-line
  const setSaleProductQty = (product, newQty) => {
    let q = Math.round(num(newQty));
    if (q < 0) q = 0;
    if (q > num(product.stock)) q = num(product.stock);
    setSaleItems((prev) => {
      const idx = prev.findIndex((i) => i.productId === product.id);
      if (q === 0) return prev.filter((i) => i.productId !== product.id);
      const entry = { productId: product.id, name: product.name, qty: q, unitPriceUsd: num(product.priceUsd), unitCostUsd: num(product.costUsd) };
      if (idx >= 0) return prev.map((i, j) => (j === idx ? entry : i));
      return [...prev, entry];
    });
  };
  const [quickClientOpen, setQuickClientOpen] = useState(false);
  const quickAddClient = (data) => {
    const created = { ...data, id: uid() };
    setClients((prev) => [...prev, created]);
    setSaleClient(created.id);
    setQuickClientOpen(false);
  };
  const [saleDiscountEnabled, setSaleDiscountEnabled] = useState(false);
  const [saleDiscountPercent, setSaleDiscountPercent] = useState("");
  const saleTotal = saleItems.reduce((a, i) => a + i.qty * i.unitPriceUsd, 0);
  const discountPercent = saleDiscountEnabled ? num(saleDiscountPercent) : 0;
  const discountUsd = saleTotal * (discountPercent / 100);
  const finalTotal = Math.max(0, saleTotal - discountUsd);
  const confirmSale = () => {
    if (saleItems.length === 0) { notify("Agrega al menos un producto a la venta."); return; }
    const client = clients.find((c) => c.id === saleClient);
    const taggedItems = saleItems.map((i) => ({ ...i, addedAt: nowIso(), addedRate: num(config.rateValue) }));
    const noteText = saleDescription.trim();
    if (saleStatus === "credito" && saleTabTarget) {
      setSales((prev) => prev.map((s) => (s.id !== saleTabTarget ? s : {
        ...s,
        items: mergeSaleItems(s.items, taggedItems),
        totalUsd: num(s.totalUsd) + finalTotal,
        totalCostUsd: num(s.totalCostUsd) + taggedItems.reduce((a, i) => a + i.qty * i.unitCostUsd, 0),
        subtotalUsd: num(s.subtotalUsd || s.totalUsd) + saleTotal,
        discountUsd: num(s.discountUsd || 0) + discountUsd,
        notes: noteText ? [...(s.notes || []), { date: nowIso(), text: noteText }] : (s.notes || []),
      })));
    } else {
      const sale = {
        id: uid(), invoiceNumber: num(config.nextInvoiceNumber) || (sales.length + 1), date: nowIso(),
        clientId: saleClient || null, clientName: client ? client.name : "Cliente ocasional", clientPhone: client ? client.phone : "",
        items: taggedItems, totalUsd: finalTotal, totalCostUsd: taggedItems.reduce((a, i) => a + i.qty * i.unitCostUsd, 0),
        subtotalUsd: saleTotal, discountPercent, discountUsd,
        rateAtSale: num(config.rateValue), status: saleStatus, paidAmountUsd: saleStatus === "pagado" ? finalTotal : 0, payments: [],
        notes: noteText ? [{ date: nowIso(), text: noteText }] : [],
      };
      setSales((prev) => [sale, ...prev]);
      setConfig((prev) => ({ ...prev, nextInvoiceNumber: (num(prev.nextInvoiceNumber) || (sales.length + 1)) + 1 }));
    }
    setProducts((prev) => prev.map((p) => {
      const used = saleItems.filter((i) => i.productId === p.id).reduce((a, i) => a + i.qty, 0);
      return used ? { ...p, stock: num(p.stock) - used } : p;
    }));
    setSaleModal(false);
  };

  // payments
  const [payModal, setPayModal] = useState(null); // { type:'sale', sale } | { type:'client', clientId, clientName, totalDebt }
  const [payAmount, setPayAmount] = useState("");
  const applyPayment = (amount, matches) => {
    let remainingAmt = num(amount);
    if (remainingAmt <= 0) return;
    setSales((prev) => {
      const targets = prev.filter((s) => matches(s) && num(s.totalUsd) - num(s.paidAmountUsd) > 0.005).sort((a, b) => new Date(a.date) - new Date(b.date));
      const updates = {};
      targets.forEach((s) => {
        if (remainingAmt <= 0) return;
        const owed = num(s.totalUsd) - num(s.paidAmountUsd);
        const pay = Math.min(owed, remainingAmt);
        remainingAmt -= pay;
        updates[s.id] = { newPaid: num(s.paidAmountUsd) + pay, delta: pay };
      });
      return prev.map((s) => (updates[s.id] ? { ...s, paidAmountUsd: updates[s.id].newPaid, payments: [...(s.payments || []), { date: nowIso(), amountUsd: updates[s.id].delta }] } : s));
    });
  };
  const registerPayment = () => {
    const amt = num(payAmount); if (amt <= 0) return;
    if (payModal.type === "sale") applyPayment(amt, (s) => s.id === payModal.sale.id);
    else applyPayment(amt, (s) => s.clientId === payModal.clientId && s.status === "credito");
    setPayModal(null); setPayAmount("");
  };

  // returns / devoluciones
  const [returnSale, setReturnSale] = useState(null);
  const [addToTab, setAddToTab] = useState(null); // group to add a product into
  const [editNoteSale, setEditNoteSale] = useState(null);
  const saveNote = (saleId, text) => {
    const clean = text.trim();
    setSales((prev) => prev.map((s) => (s.id !== saleId ? s : { ...s, notes: clean ? [{ date: nowIso(), text: clean }] : [] })));
    setEditNoteSale(null);
  };
  const [editDiscountSale, setEditDiscountSale] = useState(null);
  const saveDiscount = (saleId, enabled, percent) => {
    setSales((prev) => prev.map((s) => {
      if (s.id !== saleId) return s;
      const rawTotal = num(s.subtotalUsd != null ? s.subtotalUsd : num(s.totalUsd) + num(s.discountUsd || 0));
      const pct = enabled ? num(percent) : 0;
      const discUsd = rawTotal * (pct / 100);
      const newTotal = Math.max(0, rawTotal - discUsd);
      return { ...s, subtotalUsd: rawTotal, discountPercent: pct, discountUsd: discUsd, totalUsd: newTotal, paidAmountUsd: Math.min(num(s.paidAmountUsd), newTotal) };
    }));
    setEditDiscountSale(null);
  };
  const mergeItemsIntoSale = (saleId, items) => {
    const taggedItems = items.map((i) => ({ ...i, addedAt: nowIso(), addedRate: num(config.rateValue) }));
    setSales((prev) => prev.map((s) => (s.id !== saleId ? s : {
      ...s,
      items: mergeSaleItems(s.items, taggedItems),
      totalUsd: num(s.totalUsd) + items.reduce((a, i) => a + i.qty * i.unitPriceUsd, 0),
      totalCostUsd: num(s.totalCostUsd) + items.reduce((a, i) => a + i.qty * i.unitCostUsd, 0),
    })));
    setProducts((prev) => prev.map((p) => {
      const used = items.filter((i) => i.productId === p.id).reduce((a, i) => a + i.qty, 0);
      return used ? { ...p, stock: num(p.stock) - used } : p;
    }));
    setAddToTab(null);
  };
  const deleteSale = (saleId) => {
    askConfirm("¿Eliminar este registro de venta? Si tenía productos activos, esas unidades regresarán al inventario.", () => {
      setSales((prev) => {
        const sale = prev.find((s) => s.id === saleId);
        if (sale && sale.items.length > 0) {
          const restock = {};
          sale.items.forEach((it) => { restock[it.productId] = (restock[it.productId] || 0) + it.qty; });
          setProducts((pprev) => pprev.map((p) => (restock[p.id] ? { ...p, stock: num(p.stock) + restock[p.id] } : p)));
        }
        return prev.filter((s) => s.id !== saleId);
      });
    });
  };
  const confirmReturn = (saleId, qtyMap) => {
    const remaining = {}; Object.entries(qtyMap).forEach(([pid, q]) => { remaining[pid] = num(q); });
    if (Object.values(remaining).every((q) => q <= 0)) return;
    let refundTotal = 0, refundCostTotal = 0;
    const returnRecordItems = [];
    let shouldDelete = false;
    setSales((prev) => {
      const next = [];
      prev.forEach((s) => {
        if (s.id !== saleId) { next.push(s); return; }
        const newItems = [];
        s.items.forEach((it) => {
          const avail = remaining[it.productId] || 0;
          const q = Math.min(avail, it.qty);
          if (q > 0) {
            remaining[it.productId] = avail - q;
            refundTotal += q * num(it.unitPriceUsd);
            refundCostTotal += q * num(it.unitCostUsd);
            returnRecordItems.push({ productId: it.productId, name: it.name, qty: q, amountUsd: q * num(it.unitPriceUsd) });
          }
          const remainingQty = it.qty - q;
          if (remainingQty > 0) newItems.push({ ...it, qty: remainingQty });
        });
        if (newItems.length === 0) { shouldDelete = true; return; } // devolución total: la venta desaparece, no queda como "anulada"
        const newTotal = Math.max(0, num(s.totalUsd) - refundTotal);
        const newCost = Math.max(0, num(s.totalCostUsd) - refundCostTotal);
        const newPaid = s.status === "pagado" ? newTotal : Math.min(num(s.paidAmountUsd), newTotal);
        next.push({ ...s, items: newItems, totalUsd: newTotal, totalCostUsd: newCost, paidAmountUsd: newPaid });
      });
      return next;
    });
    const restockByProduct = {};
    returnRecordItems.forEach((it) => { restockByProduct[it.productId] = (restockByProduct[it.productId] || 0) + it.qty; });
    setProducts((prev) => prev.map((p) => (restockByProduct[p.id] ? { ...p, stock: num(p.stock) + restockByProduct[p.id] } : p)));
    setReturnSale(null);
    notify(shouldDelete ? "Devolución registrada. La venta se eliminó y el producto volvió al inventario." : "Devolución registrada y el producto volvió al inventario.");
  };

  // stock count
  const [countDraft, setCountDraft] = useState(null);
  const startCount = () => setCountDraft({ date: today(), note: "", items: products.map((p) => ({ productId: p.id, name: p.name, expected: num(p.stock), counted: num(p.stock) })) });
  const setCountedVal = (idx, val) => setCountDraft((prev) => { const items = [...prev.items]; items[idx] = { ...items[idx], counted: val }; return { ...prev, items }; });
  const saveCount = (adjust) => {
    const items = countDraft.items.map((it) => ({ ...it, diff: num(it.counted) - num(it.expected) }));
    setCounts((prev) => [{ id: uid(), date: countDraft.date, note: countDraft.note, items }, ...prev]);
    if (adjust) setProducts((prev) => prev.map((p) => { const it = items.find((i) => i.productId === p.id); return it ? { ...p, stock: num(it.counted) } : p; }));
    setCountDraft(null);
  };

  // exchange rate
  const [rateFetching, setRateFetching] = useState(false);
  const [rateError, setRateError] = useState("");
  const fetchRate = async (silent) => {
    setRateFetching(true); if (!silent) setRateError("");
    const current = num(configRef.current.rateValue);
    // consulta todas las fuentes a la vez y usa la primera (por prioridad) que responda bien
    const tries = RATE_SOURCES.map((src) => (async () => {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 9000);
      try {
        const res = await fetch(src.url(), { signal: ctrl.signal, cache: "no-store" });
        if (!res.ok) return null;
        let value = 0, fecha = "";
        if (src.type === "html") { const t = await res.text(); value = parseBcvHtml(t); fecha = parseBcvDate(t); }
        else if (src.type === "text") value = parseBcvText(await res.text());
        else value = jsonRate(await res.json());
        if (!(value > 1 && value < 10000000)) return null;
        if (src.generic && current > 0 && Math.abs(value / current - 1) > 0.06) return null;
        return { value, name: src.name, fecha };
      } catch (e) { return null; } finally { clearTimeout(timer); }
    })());
    let found = null;
    for (const t of tries) { const r = await t; if (r) { found = r; break; } }
    if (found) {
      setConfig((prev) => (num(prev.rateValue) === found.value && prev.rateAuto !== false ? prev : { ...prev, rateValue: found.value, rateDate: today(), rateManual: false, rateAuto: true, rateSource: found.name }));
      setRateError("");
      if (!silent) {
        const v = found.value.toLocaleString("es-VE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        notify("Tasa actualizada: " + v + " Bs (" + found.name + (found.fecha ? " · valor " + found.fecha : "") + ")" + (found.name !== "BCV" ? ". No se pudo leer el BCV directo; esta fuente puede tardar en reflejar la tasa nueva. Si no coincide, usa el lápiz para escribirla." : ""));
      }
    } else if (!silent) {
      setRateError("No se pudo leer la tasa. Intenta de nuevo o escríbela con el lápiz.");
    }
    setRateFetching(false);
  };
  // Actualización automática: al abrir la app, cada 5 minutos y al volver a la pestaña
  const configRef = useRef(config); configRef.current = config;
  const fetchRateRef = useRef(null); fetchRateRef.current = fetchRate;
  const lastRateRun = useRef(0);
  useEffect(() => {
    const run = () => {
      if (configRef.current.rateAuto === false) return;
      if (Date.now() - lastRateRun.current < 60000) return;
      lastRateRun.current = Date.now();
      fetchRateRef.current(true);
    };
    run();
    const id = setInterval(run, 5 * 60 * 1000);
    const onVis = () => { if (document.visibilityState === "visible") run(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { clearInterval(id); document.removeEventListener("visibilitychange", onVis); };
  }, []);

  // invoice viewer
  const [invoiceGroup, setInvoiceGroup] = useState(null);
  const openInvoiceForSale = (sale) => {
    const key = sale.clientId || ("occ-" + sale.id);
    const group = clientGroups.find((g) => g.key === key);
    setInvoiceGroup(group || { key, clientId: sale.clientId, clientName: sale.clientName, clientPhone: sale.clientPhone, sales: [sale], totalUsd: sale.totalUsd, paidUsd: sale.paidAmountUsd, debt: num(sale.totalUsd) - num(sale.paidAmountUsd) });
  };
  const openInvoiceSingle = (sale) => {
    setInvoiceGroup({ key: "single-" + sale.id, clientId: sale.clientId, clientName: sale.clientName, clientPhone: sale.clientPhone, sales: [sale], totalUsd: sale.totalUsd, paidUsd: sale.paidAmountUsd, debt: num(sale.totalUsd) - num(sale.paidAmountUsd) });
  };
  const [settingsOpen, setSettingsOpen] = useState(false);

  const NAV = [
    { id: "dashboard", label: "Resumen", icon: Store },
    { id: "inventario", label: "Inventario", icon: Package },
    { id: "catalogo", label: "Catálogo", icon: ClipboardList },
    { id: "ventas", label: "Ventas", icon: ShoppingCart },
    { id: "deudas", label: "Deudas", icon: CreditCard },
    { id: "clientes", label: "Clientes", icon: Users },
    { id: "conteo", label: "Conteo", icon: ClipboardCheck },
    { id: "estadisticas", label: "Estadísticas", icon: BarChart3 },
  ];

  return (
    <div
      style={{
        fontFamily: "var(--font-body)", background: "var(--pagebg)", color: "var(--ink)", minHeight: "100vh", display: "flex", flexDirection: "column",
        ...(config.theme === "dark" ? {
          "--pagebg": "#0B1622", "--cream": "#16262E", "--cream-soft": "#1E323B", "--kraft": "#1C2E36", "--kraft-dark": "rgba(255,255,255,0.14)",
          "--ink": "#F3F6FA", "--ink-soft": "#93A5B8",
          "--chrometext": "#F3F6FA", "--chrometext-soft": "#9FB6C4", "--sidebarbg": "#10333A", "--sidebar-active": "#1B4E56",
          "--stamp": "#F2703A", "--limon": "#35C77D", "--caramel": "#4C8DF0",
        } : {
          "--pagebg": "#FFFFFF", "--cream": "#F2EDE0", "--cream-soft": "#E4DCC8", "--kraft": "#E9E3D3", "--kraft-dark": "#DDD6C4",
          "--ink": "#14181F", "--ink-soft": "#5B6472",
          "--chrometext": "#E7EEFC", "--chrometext-soft": "#B7C6E8", "--sidebarbg": "#142850", "--sidebar-active": "#2F6FE0",
          "--stamp": "#E8752B", "--limon": "#219653", "--caramel": "#2F6FE0",
        }),
      }}
      className="w-full"
    >
      <GlobalStyle />
      <div className="flex items-center justify-between px-4 md:px-6 py-4" style={{ borderBottom: "1px solid var(--kraft-dark)" }}>
        <div className="flex items-center gap-3">
          <button className="md:hidden" onClick={() => setMobileMenu((v) => !v)} aria-label="Menú" style={{ color: "var(--ink)" }}><Menu size={22} /></button>
          <div>
            <h1 style={{ fontFamily: "var(--font-display)", fontWeight: 600, color: "var(--ink)" }} className="text-xl leading-tight">{config.businessName}</h1>
            <p className="text-xs" style={{ color: "var(--ink-soft)" }}>{new Date().toLocaleDateString("es-VE", { weekday: "long", day: "numeric", month: "long" })}</p>
          </div>
        </div>
        <div className="flex items-center gap-3">
          <RateWidget config={config} setConfig={setConfig} fetchRate={() => fetchRate(false)} rateFetching={rateFetching} rateError={rateError} />
          <button onClick={() => setConfig((p) => ({ ...p, theme: p.theme === "dark" ? "light" : "dark" }))} aria-label="Cambiar tema" title="Cambiar tema claro/oscuro" style={{ color: "var(--ink-soft)" }}>{config.theme === "dark" ? <Sun size={19} /> : <Moon size={19} />}</button>
          <button onClick={() => setSettingsOpen(true)} aria-label="Ajustes" style={{ color: "var(--ink-soft)" }}><Settings size={19} /></button>
          <button onClick={onLogout} aria-label="Cerrar sesión" title="Cerrar sesión" style={{ color: "var(--ink-soft)" }}><LogOut size={19} /></button>
        </div>
      </div>

      <div className="flex" style={{ flex: 1 }}>
        <div className="hidden md:flex flex-col gap-1 p-3 w-56 shrink-0" style={{ background: "var(--sidebarbg)" }}>
          {NAV.map((n) => (
            <button key={n.id} className={"tab-btn text-left " + (tab === n.id ? "active" : "")} onClick={() => setTab(n.id)}><n.icon size={17} /> {n.label}</button>
          ))}
        </div>
        {mobileMenu && (
          <div className="fixed inset-0 z-40 md:hidden" style={{ background: "rgba(30,22,14,0.5)" }} onClick={() => setMobileMenu(false)}>
            <div className="w-64 h-full p-3 flex flex-col gap-1" style={{ background: "var(--sidebarbg)" }} onClick={(e) => e.stopPropagation()}>
              {NAV.map((n) => (
                <button key={n.id} className={"tab-btn text-left " + (tab === n.id ? "active" : "")} onClick={() => { setTab(n.id); setMobileMenu(false); }}><n.icon size={17} /> {n.label}</button>
              ))}
            </div>
          </div>
        )}

        <div className="flex-1 p-4 md:p-6 pb-24 md:pb-6 min-w-0">
          {tab === "dashboard" && (
            <Dashboard
              costoInventario={costoInventario} valorInventario={valorInventario} gananciaPotencial={gananciaPotencial}
              gananciaMes={gananciaMes} ventasMesTotal={ventasMesTotal} balanceCaja={balanceCaja}
              productoEstrella={productoEstrella} productoRanking={productoRanking} totalReferencias={products.length} deudaTotal={deudaTotal}
              deudas={deudas.slice(0, 5)} ventasPagadas={ventasPagadas} config={config} stockBajo={stockBajo}
              onNuevaVenta={openSaleModal} onNuevoProducto={() => setProductModal({})} onVerFactura={openInvoiceForSale}
              onNavigate={setTab}
            />
          )}
          {tab === "inventario" && <Inventario products={products} onNew={() => setProductModal({})} onEdit={(p) => setProductModal(p)} onDelete={deleteProduct} config={config} />}
          {tab === "catalogo" && <Catalogo products={products} config={config} onToggleHidden={(p) => saveProduct({ ...p, hidden: !p.hidden })} notify={notify} />}
          {tab === "ventas" && <Ventas groups={ventasGroups} onNueva={openSaleModal} onAbono={(s) => setPayModal({ type: "sale", sale: s })} onVerFactura={openInvoiceForSale} onVerFacturaSingle={openInvoiceSingle} onDevolucion={(s) => setReturnSale(s)} onDeleteSale={deleteSale} onEditNote={(s) => setEditNoteSale(s)} onEditDiscount={(s) => setEditDiscountSale(s)} config={config} />}
          {tab === "deudas" && <Deudas groups={debtGroups} onAbono={(g) => setPayModal(g.clientId ? { type: "client", clientId: g.clientId, clientName: g.clientName, totalDebt: g.debt, openSales: g.sales.filter((s) => s.status === "credito" && num(s.totalUsd) - num(s.paidAmountUsd) > 0.005) } : { type: "sale", sale: g.sales[0] })} onAbonoSale={(s) => setPayModal({ type: "sale", sale: s })} config={config} onVerFactura={openInvoiceForSale} onVerFacturaSingle={openInvoiceSingle} onDevolucion={(s) => setReturnSale(s)} onAddProduct={(g) => setAddToTab(g)} onNuevaDeuda={() => openSaleModal("credito")} onEditNote={(s) => setEditNoteSale(s)} onEditDiscount={(s) => setEditDiscountSale(s)} notify={notify} />}
          {tab === "clientes" && <Clientes config={config} clients={clients} onNew={() => setClientModal({})} onEdit={(c) => setClientModal(c)} onDelete={deleteClient} clientDebt={clientDebt} clientBought={clientBought} />}
          {tab === "conteo" && <Conteo counts={counts} countDraft={countDraft} onStart={startCount} setCountedVal={setCountedVal} onSave={saveCount} onCancel={() => setCountDraft(null)} setNote={(n) => setCountDraft((p) => ({ ...p, note: n }))} />}
          {tab === "estadisticas" && <Estadisticas config={config} last6MonthsData={last6MonthsData} topProductosData={topProductosData} productoEstrella={productoEstrella} ventasMesCount={salesThisMonth.length} ventasMesSettledCount={settledThisMonth.length} ventasMesTotal={ventasMesTotal} inversionMes={inversionMes} gananciaMes={gananciaMes} />}
        </div>
      </div>

      <div className="md:hidden fixed bottom-0 left-0 right-0 flex justify-around py-2 z-30" style={{ background: "var(--sidebarbg)" }}>
        {NAV.filter((n) => ["dashboard", "inventario", "catalogo", "ventas", "deudas", "clientes"].indexOf(n.id) >= 0).map((n) => (
          <button key={n.id} onClick={() => setTab(n.id)} className="flex flex-col items-center gap-0.5 px-1" style={{ color: tab === n.id ? "var(--stamp)" : "var(--chrometext-soft)" }}>
            <n.icon size={20} /><span style={{ fontSize: 10.5, fontWeight: 500 }}>{n.label}</span>
          </button>
        ))}
      </div>

      {productModal && <ProductModal data={productModal} onSave={saveProduct} onClose={() => setProductModal(null)} notify={notify} />}
      {clientModal && <ClientModal data={clientModal} onSave={saveClient} onClose={() => setClientModal(null)} notify={notify} />}
      {quickClientOpen && <ClientModal data={{}} onSave={quickAddClient} onClose={() => setQuickClientOpen(false)} notify={notify} />}
      {saleModal && (
        <SaleModal
          products={products} clients={clients} saleClient={saleClient} setSaleClient={setSaleClient}
          saleStatus={saleStatus} setSaleStatus={setSaleStatus} saleItems={saleItems}
          setSaleProductQty={setSaleProductQty} saleTotal={saleTotal} config={config}
          openTabsForClient={openTabsForClient} saleTabTarget={saleTabTarget} setSaleTabTarget={setSaleTabTarget}
          saleDescription={saleDescription} setSaleDescription={setSaleDescription}
          saleDiscountEnabled={saleDiscountEnabled} setSaleDiscountEnabled={setSaleDiscountEnabled}
          saleDiscountPercent={saleDiscountPercent} setSaleDiscountPercent={setSaleDiscountPercent}
          discountUsd={discountUsd} finalTotal={finalTotal}
          onQuickAddClient={() => setQuickClientOpen(true)}
          onConfirm={confirmSale} onClose={() => setSaleModal(false)}
        />
      )}
      {payModal && (
        <Modal title={"Registrar abono — " + (payModal.type === "sale" ? payModal.sale.clientName : payModal.clientName)} onClose={() => setPayModal(null)}>
          <p className="text-sm mb-3" style={{ color: "var(--ink-soft)" }}>
            Deuda {payModal.type === "sale" ? "de esta venta" : "total del cliente"}: <b style={{ fontFamily: "var(--font-mono)" }}>{usd(payModal.type === "sale" ? num(payModal.sale.totalUsd) - num(payModal.sale.paidAmountUsd) : payModal.totalDebt)}</b> <span style={{ fontFamily: "var(--font-mono)", fontSize: 12 }}>({bs((payModal.type === "sale" ? num(payModal.sale.totalUsd) - num(payModal.sale.paidAmountUsd) : payModal.totalDebt) * num(config.rateValue))})</span>
          </p>
          <Field label="Monto del abono (USD)"><TextInput type="number" min="0" step="0.01" value={payAmount} onChange={(e) => setPayAmount(e.target.value)} placeholder="0.00" /></Field>
          {payModal.type === "client" && <p className="text-xs mb-2" style={{ color: "var(--ink-soft)" }}>El abono se aplicará primero a la compra más antigua pendiente.</p>}
          <div className="flex justify-end gap-2 mt-2">
            <Btn variant="ghost" onClick={() => setPayModal(null)}>Cancelar</Btn>
            <Btn variant="stamp" onClick={registerPayment}><Check size={16} />Registrar abono</Btn>
          </div>
        </Modal>
      )}
      {invoiceGroup && <InvoiceModal group={invoiceGroup} config={config} products={products} onClose={() => setInvoiceGroup(null)} notify={notify} />}
      {returnSale && <ReturnModal sale={returnSale} onConfirm={confirmReturn} onClose={() => setReturnSale(null)} />}
      {addToTab && <AddToTabModal group={addToTab} products={products} config={config} onConfirm={mergeItemsIntoSale} onClose={() => setAddToTab(null)} notify={notify} />}
      {editNoteSale && <EditNoteModal sale={editNoteSale} onSave={saveNote} onClose={() => setEditNoteSale(null)} />}
      {editDiscountSale && <EditDiscountModal sale={editDiscountSale} onSave={saveDiscount} onClose={() => setEditDiscountSale(null)} />}
      {settingsOpen && <SettingsModal config={config} setConfig={setConfig} onClose={() => setSettingsOpen(false)} />}
      {notice && (
        <div className="fixed bottom-20 md:bottom-6 left-1/2 px-4 py-3 rounded-lg shadow-lg max-w-sm text-sm" style={{ background: "#111827", color: "#FFFFFF", border: "1px solid rgba(255,255,255,0.25)", transform: "translateX(-50%)", zIndex: 60 }}>
          <div className="flex items-center gap-3">
            <span>{notice}</span>
            <button onClick={() => setNotice(null)} aria-label="Cerrar aviso"><X size={14} /></button>
          </div>
        </div>
      )}
      {confirmDialog && (
        <Modal title="Confirmar" onClose={() => setConfirmDialog(null)}>
          <p className="text-sm mb-4">{confirmDialog.message}</p>
          <div className="flex justify-end gap-2">
            <Btn variant="ghost" onClick={() => setConfirmDialog(null)}>Cancelar</Btn>
            <Btn variant="stamp" onClick={() => { confirmDialog.onConfirm(); setConfirmDialog(null); }}><Check size={16} />Confirmar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

function VeFlagBadge() {
  return (
    <svg width="24" height="16" viewBox="0 0 36 24" style={{ borderRadius: 3, flexShrink: 0, display: "inline-block", verticalAlign: "middle" }}>
      <rect width="36" height="8" y="0" fill="#FFCC00" />
      <rect width="36" height="8" y="8" fill="#00247D" />
      <rect width="36" height="8" y="16" fill="#CF142B" />
      <text x="18" y="16" textAnchor="middle" dominantBaseline="middle" fontSize="9" fontWeight="800" fill="#FFFFFF" stroke="#00247D" strokeWidth="0.6" paintOrder="stroke" fontFamily="sans-serif">Ves</text>
    </svg>
  );
}

function RateWidget({ config, setConfig, fetchRate, rateFetching, rateError }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(config.rateValue);
  useEffect(() => setVal(config.rateValue), [config.rateValue]);
  return (
    <div className="text-right">
      <div className="text-xs font-semibold" style={{ color: "var(--ink-soft)" }}>Tasa del día</div>
      {!editing ? (
        <button onClick={() => setEditing(true)} className="flex items-center gap-2 justify-end" style={{ fontFamily: "var(--font-mono)" }}>
          <span className="text-base font-bold inline-flex items-center gap-1" style={{ color: "var(--ink)", whiteSpace: "nowrap" }}>1$ = <VeFlagBadge /> {num(config.rateValue).toLocaleString("es-VE", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} Bs</span>
          <Pencil size={12} style={{ color: "var(--ink-soft)" }} />
        </button>

async function loadImageEl(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

async function buildCatalogImage(products, config) {
  const visible = products.filter((p) => !p.hidden).sort((a, b) => a.name.localeCompare(b.name, "es"));
  const cols = 3, cellW = 220, cellH = 260, pad = 24, headerH = 90;
  const rows = Math.max(1, Math.ceil(visible.length / cols));
  const width = cols * cellW + pad * 2;
  const height = headerH + rows * cellH + pad;
  const scale = 2;
  const canvas = document.createElement("canvas");
  canvas.width = width * scale; canvas.height = height * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  ctx.fillStyle = "#F6EFDF"; ctx.fillRect(0, 0, width, height);
  ctx.textBaseline = "top"; ctx.textAlign = "center";
  ctx.font = "bold 26px sans-serif"; ctx.fillStyle = "#2B2016";
  ctx.fillText(config.businessName, width / 2, 24);
  ctx.font = "13px sans-serif"; ctx.fillStyle = "#6B5A45";
  ctx.fillText("Catálogo de productos", width / 2, 56);

  const images = await Promise.all(visible.map((p) => (p.photo ? loadImageEl(p.photo) : Promise.resolve(null))));

  visible.forEach((p, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const x = pad + col * cellW, y = headerH + row * cellH;
    const photoSize = cellW - 24;
    ctx.fillStyle = "#E9E3D3";
    ctx.fillRect(x + 12, y, photoSize, photoSize);
    const img = images[i];
    const unavailable = num(p.stock) <= 0;
    if (img) { ctx.globalAlpha = unavailable ? 0.4 : 1; ctx.drawImage(img, x + 12, y, photoSize, photoSize); ctx.globalAlpha = 1; }
    ctx.textAlign = "left"; ctx.font = "bold 15px sans-serif"; ctx.fillStyle = "#2B2016";
    ctx.fillText(p.name.length > 22 ? p.name.slice(0, 20) + "…" : p.name, x + 12, y + photoSize + 10);
    if (unavailable) {
      ctx.font = "bold 13px sans-serif"; ctx.fillStyle = "#C6412B";
      ctx.fillText("No disponible", x + 12, y + photoSize + 32);
    } else {
      ctx.font = "bold 14px monospace"; ctx.fillStyle = "#2B2016";
      ctx.fillText(usd(p.priceUsd), x + 12, y + photoSize + 32);
    }
  });
  return canvas;
}

function Catalogo({ products, config, onToggleHidden, notify }) {
  const [generating, setGenerating] = useState(false);
  const [catalogImg, setCatalogImg] = useState(null);
  const shareCatalog = async () => {
    setGenerating(true);
    try {
      const canvas = await buildCatalogImage(products, config);
      await new Promise((resolve) => {
        canvas.toBlob(async (blob) => {
          const file = new File([blob], "catalogo.png", { type: "image/png" });
          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            try { await navigator.share({ files: [file], title: config.businessName, text: "Catálogo de " + config.businessName }); }
            catch (e) { /* cerrado por el usuario */ }
          } else {
            setCatalogImg(canvas.toDataURL("image/png"));
          }
          resolve();
        }, "image/png", 1);
      });
    } catch (e) {
      notify("No se pudo generar la imagen del catálogo.");
    }
    setGenerating(false);
  };
  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <h2 style={{ fontFamily: "var(--font-display)" }} className="text-2xl">Catálogo virtual</h2>
        {products.length > 0 && <Btn variant="limon" disabled={generating} onClick={shareCatalog} className="text-base py-2.5 px-4"><Camera size={20} />{generating ? "Generando…" : "Compartir catálogo"}</Btn>}
      </div>
      {products.length === 0 ? <Empty text="Agrega productos en Inventario para verlos aquí." /> : (
        <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2">
          {products.slice().sort((a, b) => a.name.localeCompare(b.name, "es")).map((p) => {
            const unavailable = num(p.stock) <= 0;
            return (
              <div key={p.id} className="rounded-lg p-3 relative" style={{ background: p.hidden ? "rgba(43,32,22,0.05)" : "var(--cream)", border: "1px solid var(--kraft-dark)", opacity: p.hidden ? 0.55 : 1 }}>
                <button onClick={() => onToggleHidden(p)} className="absolute top-2 right-2" aria-label={p.hidden ? "Mostrar en catálogo" : "Ocultar del catálogo"}>{p.hidden ? <EyeOff size={14} /> : <Eye size={14} />}</button>
                <div className="w-full aspect-square rounded-md flex items-center justify-center mb-2 overflow-hidden" style={{ background: "var(--kraft)" }}>
                  {p.photo ? <img src={p.photo} alt={p.name} className="w-full h-full object-cover" style={{ opacity: unavailable ? 0.4 : 1 }} /> : <Package size={26} style={{ color: "var(--ink-soft)" }} />}
                </div>
                <div className="text-sm font-medium leading-tight">{p.name}</div>
                <div className="text-xs" style={{ color: "var(--ink-soft)" }}>{p.category || " "}</div>
                {unavailable ? (
                  <div className="text-xs mt-1 font-semibold" style={{ color: "var(--stamp)" }}>No disponible</div>
                ) : (
                  <div className="mt-1" style={{ fontFamily: "var(--font-mono)" }}>{usd(p.priceUsd)}</div>
                )}
              </div>
            );
          })}
        </div>
      )}
      {catalogImg && (
        <div className="mt-4 text-center">
          <img src={catalogImg} alt="Catálogo" className="w-full rounded-lg" style={{ border: "1px solid var(--kraft-dark)", maxWidth: 420, margin: "0 auto" }} />
          <p className="text-xs mt-2 font-medium" style={{ color: "var(--caramel)" }}>Mantén presionada la imagen y elige "Compartir" o "Enviar a WhatsApp".</p>
        </div>
      )}
    </div>
  );
}

                        {num(s.discountPercent) > 0 && <button onClick={() => onEditDiscount(s)} className="px-1.5 py-0.5 rounded" style={{ background: "var(--caramel)", color: "#fff", fontSize: 11, fontWeight: 600 }}>-{s.discountPercent}%</button>}
                        <span style={{ color: s.status === "pagado" ? "var(--limon)" : "var(--stamp)", fontSize: 11 }}>{s.status === "pagado" ? "pagado" : "crédito · debe " + usd(num(s.totalUsd) - num(s.paidAmountUsd))}</span>
                        {s.items.length > 0 && <button onClick={() => onDevolucion(s)} title="Registrar devolución" style={{ color: "var(--caramel)" }}><RotateCcw size={14} /></button>}
                        {s.status === "credito" && num(s.totalUsd) - num(s.paidAmountUsd) > 0.005 && <Btn variant="ghost" onClick={() => onAbono(s)}>Abonar</Btn>}
                        <button onClick={() => onVerFacturaSingle(s)} title="Ver/compartir solo esta factura"><FileText size={14} /></button>
                        <button onClick={() => onDeleteSale(s.id)} title="Eliminar este registro de venta" style={{ color: "var(--stamp)" }}><Trash2 size={14} /></button>
                      </span>
                    </div>
                    <div className="flex items-center gap-2 mb-1">
                      <button onClick={() => onEditNote(s)} className="text-xs inline-flex items-center gap-1" style={{ color: "var(--caramel)" }}>
                        {s.notes && s.notes.length > 0 ? "📝 " + s.notes[s.notes.length - 1].text : "+ agregar descripción"} <Pencil size={11} />
                      </button>
                      {!(num(s.discountPercent) > 0) && <button onClick={() => onEditDiscount(s)} className="text-xs" style={{ color: "var(--ink-soft)" }}>+ descuento</button>}
                    </div>
                    <table className="ledger w-full">
                      <thead><tr><th>Producto</th><th>Cant.</th><th>Precio</th><th>Subtotal</th></tr></thead>
                      <tbody>{sortedItems(s.items).map((it, idx) => (<tr key={idx}><td>{it.name}</td><td>{it.qty}</td><td>{usd(it.unitPriceUsd)}</td><td>{usd(it.qty * it.unitPriceUsd)}</td></tr>))}</tbody>
                    </table>
                  </div>
                ))}
              </div>
            </details>
          ))}
        </div>
      )}
    </div>
  );
}

function Deudas({ groups, onAbono, onAbonoSale, config, onVerFactura, onVerFacturaSingle, onDevolucion, onAddProduct, onNuevaDeuda, onEditNote, onEditDiscount, notify }) {
  const [waGroup, setWaGroup] = useState(null);
  const [waBusy, setWaBusy] = useState(false);
  const [waPreview, setWaPreview] = useState(null);
  const pendingGroup = (g) => {
    const sales = g.sales.filter((s) => s.status === "credito" && num(s.totalUsd) - num(s.paidAmountUsd) > 0.005);
    const totalUsd = sales.reduce((a, s) => a + num(s.totalUsd), 0);
    const paidUsd = sales.reduce((a, s) => a + num(s.paidAmountUsd), 0);
    return { ...g, sales, totalUsd, paidUsd, debt: Math.max(0, totalUsd - paidUsd) };
  };
  const sendReminder = (g) => {
    if (!waPhone(g.clientPhone)) { notify("Este cliente no tiene un número de teléfono registrado. Agrégalo en Clientes."); return; }
    setWaPreview(null);
    setWaGroup(g);
  };
  const sendWaText = (g) => {
    const msg = reminderMessage(config) + "\n\n" + buildInvoiceText(pendingGroup(g), config, "both", 0);
    window.open("https://wa.me/" + waPhone(g.clientPhone) + "?text=" + encodeURIComponent(msg), "_blank");
    setWaGroup(null);
  };
  const sendWaImage = async (g) => {
    setWaBusy(true);
    try {
      const canvas = buildInvoiceImage(pendingGroup(g), config, "both", 0);
      await new Promise((resolve) => {
        canvas.toBlob(async (blob) => {
          const file = new File([blob], "factura.png", { type: "image/png" });
          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            try { await navigator.share({ files: [file], title: config.businessName, text: reminderMessage(config) }); setWaGroup(null); } catch (e) { /* cerrado por el usuario */ }
          } else {
            setWaPreview(canvas.toDataURL("image/png"));
          }
          resolve();
        }, "image/png", 1);
      });
    } catch (e) { notify("No se pudo generar la imagen de la factura."); }
    setWaBusy(false);
  };
  const [q, setQ] = useState("");
  const filtered = groups.filter((g) => g.clientName.toLowerCase().includes(q.toLowerCase()));
  const totalDeuda = groups.reduce((a, g) => a + num(g.debt), 0);
  return (
    <div>
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <h2 style={{ fontFamily: "var(--font-display)" }} className="text-2xl">Deudas</h2>
        <div className="flex items-center gap-2 flex-wrap">
          <div className="flex items-center gap-2 px-3 rounded-md" style={{ background: "var(--cream)", border: "1px solid var(--kraft-dark)" }}>
            <Search size={14} style={{ color: "var(--ink-soft)" }} />
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Buscar cliente" className="py-2 text-sm outline-none bg-transparent" />
          </div>
          <Btn variant="stamp" onClick={onNuevaDeuda}><Plus size={16} />Nueva deuda</Btn>
        </div>
      </div>
      {waGroup && (
        <Modal title={"Enviar a " + waGroup.clientName} onClose={() => setWaGroup(null)}>
          <p className="text-xs mb-3" style={{ color: "var(--ink-soft)" }}>Se enviará este mensaje junto con la factura de lo que debe:</p>
          <div className="rounded-md p-3 mb-3 text-sm" style={{ background: "var(--kraft)", whiteSpace: "pre-line" }}>{reminderMessage(config)}</div>
          <div className="flex flex-col gap-2">
            <Btn variant="limon" disabled={waBusy} onClick={() => sendWaImage(waGroup)} className="w-full justify-center py-3"><Camera size={18} />{waBusy ? "Preparando…" : "Factura como imagen + mensaje"}</Btn>
            <p className="text-xs" style={{ color: "var(--ink-soft)" }}>Se abre el menú de compartir: elige WhatsApp y luego el chat del cliente.</p>
            <Btn variant="ghost" onClick={() => sendWaText(waGroup)} className="w-full justify-center py-3"><MessageCircle size={18} />Factura en texto + mensaje (directo al chat del cliente)</Btn>
          </div>
          {waPreview && (
            <div className="mt-3 text-center">
              <img src={waPreview} alt="Factura" className="w-full rounded-lg" style={{ border: "1px solid var(--kraft-dark)", maxWidth: 340, margin: "0 auto" }} />
              <p className="text-xs mt-2 font-medium" style={{ color: "var(--caramel)" }}>Mantén presionada la imagen y elige "Compartir" para enviarla por WhatsApp.</p>
            </div>
          )}
        </Modal>
      )}
      {groups.length > 0 && (
        <div className="rounded-lg p-3 mb-3 flex items-center justify-between gap-2 flex-wrap" style={{ background: "var(--cream)", border: "1px solid var(--stamp)" }}>
          <div>
            <div className="text-xs" style={{ color: "var(--ink-soft)" }}>Total en deudas pendientes · {groups.length} {groups.length === 1 ? "cliente" : "clientes"}</div>
            <div style={{ fontFamily: "var(--font-mono)", color: "var(--stamp)", fontSize: 24, fontWeight: 700 }}>{usd(totalDeuda)}</div>
          </div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 16, fontWeight: 600, color: "var(--ink-soft)" }}>{bs(totalDeuda * num(config.rateValue))}</div>
        </div>
      )}
      {groups.length === 0 ? <Empty text="No tienes clientes con deudas pendientes." cta="Registrar una deuda" onClick={onNuevaDeuda} /> : (
        <div className="flex flex-col gap-2">
          {filtered.map((g) => {
            const credits = g.sales.filter((s) => s.status === "credito" && num(s.totalUsd) - num(s.paidAmountUsd) > 0.005);
            return (
              <details key={g.key} className="rounded-lg p-3" style={{ background: "var(--cream)", border: "1px solid var(--kraft-dark)" }}>
                <summary className="flex flex-col gap-2 cursor-pointer">
                  <span className="text-base"><b>{g.clientName}</b>{credits.some((s) => num(s.discountPercent) > 0) && <span className="ml-1 px-1.5 py-0.5 rounded text-xs font-semibold" style={{ background: "var(--caramel)", color: "#fff" }}>% desc.</span>}</span>
                  <span className="flex items-center gap-2 flex-wrap">
                    <span style={{ fontFamily: "var(--font-mono)", color: "var(--stamp)", fontSize: 16, fontWeight: 600 }}>{usd(g.debt)} <span style={{ fontSize: 12, fontWeight: 400, color: "var(--ink-soft)" }}>({bs(g.debt * num(config.rateValue))})</span></span>
                    <Btn variant="ghost" onClick={(e) => { e.preventDefault(); onAbono(g); }}>Abonar completo</Btn>
                    <button onClick={(e) => { e.preventDefault(); onAddProduct(g); }} title="Agregar producto a esta cuenta" style={{ color: "var(--caramel)" }}><Plus size={22} /></button>
                    <button onClick={(e) => { e.preventDefault(); onVerFactura(g.sales[0]); }} title="Ver factura"><FileText size={15} /></button>
                    <button onClick={(e) => { e.preventDefault(); sendReminder(g); }} title="Enviar recordatorio por WhatsApp" style={{ color: "var(--limon)" }}><MessageCircle size={17} /></button>
                  </span>
                </summary>
                <div className="flex flex-col gap-2 mt-2">
                  {credits.map((s) => {
                    const debe = num(s.totalUsd) - num(s.paidAmountUsd);
                    const noteText = s.notes && s.notes.length > 0 ? s.notes[s.notes.length - 1].text : "";
                    return (
                      <details key={s.id} className="rounded-md p-2" style={{ border: "1px solid var(--kraft-dark)" }}>
                        <summary className="flex flex-wrap items-center justify-between gap-2 cursor-pointer text-xs">
                          <span style={{ color: "var(--ink-soft)" }}>
                            Factura #{s.invoiceNumber} · {fmtDateTime(s.date)}
                            <button onClick={(e) => { e.preventDefault(); onEditNote(s); }} className="ml-1 inline-flex items-center gap-1" style={{ color: "var(--caramel)", fontWeight: 500 }}>
                              {noteText ? "· " + noteText : "+ agregar descripción"} <Pencil size={11} />
                            </button>
                          </span>
                          <span className="flex items-center gap-2 flex-wrap">
                            <span style={{ fontFamily: "var(--font-mono)" }}>Total {usd(s.totalUsd)} <span style={{ color: "var(--ink-soft)" }}>({bs(s.totalUsd * num(config.rateValue))})</span></span>
                            {num(s.discountPercent) > 0 ? (
                              <button onClick={(e) => { e.preventDefault(); onEditDiscount(s); }} className="px-1.5 py-0.5 rounded" style={{ background: "var(--caramel)", color: "#fff", fontSize: 11, fontWeight: 600 }}>-{s.discountPercent}%</button>
                            ) : (
                              <button onClick={(e) => { e.preventDefault(); onEditDiscount(s); }} className="text-xs" style={{ color: "var(--ink-soft)" }}>+ descuento</button>
                            )}
                            <span style={{ fontFamily: "var(--font-mono)", color: debe > 0.005 ? "var(--stamp)" : "var(--limon)" }}>Debe {usd(debe)} <span style={{ color: "var(--ink-soft)" }}>({bs(debe * num(config.rateValue))})</span></span>
                            {debe > 0.005 && <Btn variant="ghost" onClick={(e) => { e.preventDefault(); onAbonoSale(s); }}>Abonar</Btn>}
                            {s.items.length > 0 && <button onClick={(e) => { e.preventDefault(); onDevolucion(s); }} title="Registrar devolución" style={{ color: "var(--caramel)" }}><RotateCcw size={14} /></button>}
                            <button onClick={(e) => { e.preventDefault(); onVerFacturaSingle(s); }} title="Ver/compartir solo esta factura"><FileText size={14} /></button>
                          </span>
                        </summary>
                        <table className="ledger w-full mt-1">
                          <thead><tr><th>Producto</th><th>Cant.</th><th>Precio</th><th>Subtotal</th></tr></thead>
                          <tbody>{sortedItems(s.items).map((it, idx) => (<tr key={idx}><td>{it.name}</td><td>{it.qty}</td><td>{usd(it.unitPriceUsd)}</td><td>{usd(it.qty * it.unitPriceUsd)}</td></tr>))}</tbody>
                        </table>
                      </details>
                    );
                  })}
                </div>
              </details>
            );
          })}
        </div>
      )}
    </div>
  );
}

      <div className="flex items-center justify-between mb-4">
        <h2 style={{ fontFamily: "var(--font-display)" }} className="text-2xl">Clientes <span style={{ fontSize: 15, fontWeight: 500, color: "var(--ink-soft)", fontFamily: "var(--font-body)" }}>· {clients.length} {clients.length === 1 ? "cliente registrado" : "clientes registrados"}</span></h2>
        <Btn variant="stamp" onClick={onNew}><Plus size={16} />Nuevo cliente</Btn>

        <div className="rounded-lg overflow-x-auto" style={{ background: "var(--cream)", border: "1px solid var(--kraft-dark)" }}>
          <table className="ledger w-full">
            <thead><tr><th>Nombre</th><th>Teléfono</th><th>Total comprado</th><th>Deuda actual</th><th></th></tr></thead>
            <tbody>
              {clients.slice().sort((a, b) => a.name.localeCompare(b.name, "es")).map((c) => (

                  <td style={{ fontFamily: "var(--font-mono)", color: clientDebt(c.id) > 0 ? "var(--stamp)" : "inherit" }}>{usd(clientDebt(c.id))}<div style={{ fontSize: 11, color: "var(--ink-soft)" }}>{bs(clientDebt(c.id) * num(config.rateValue))}</div></td>

function Conteo({ counts, countDraft, onStart, setCountedVal, onSave, onCancel, setNote }) {
  if (countDraft) {
    const diffs = countDraft.items.filter((i) => num(i.counted) !== num(i.expected));
    return (
      <div>
        <h2 style={{ fontFamily: "var(--font-display)" }} className="text-2xl mb-1">Nuevo conteo — {countDraft.date}</h2>
        <p className="text-xs mb-3" style={{ color: "var(--ink-soft)" }}>Cuenta físicamente tu mercancía y compara con lo que el sistema tiene registrado.</p>
        <TextInput placeholder="Nota (opcional)" value={countDraft.note} onChange={(e) => setNote(e.target.value)} className="mb-3 max-w-sm" />
        <div className="rounded-lg overflow-x-auto" style={{ background: "var(--cream)", border: "1px solid var(--kraft-dark)" }}>
          <table className="ledger w-full">
            <thead><tr><th>Producto</th><th>Sistema</th><th>Contado</th><th>Diferencia</th></tr></thead>
            <tbody>
              {countDraft.items.map((it, idx) => {
                const diff = num(it.counted) - num(it.expected);
                return (<tr key={it.productId} className="ledger-row"><td>{it.name}</td><td style={{ fontFamily: "var(--font-mono)" }}>{it.expected}</td><td><TextInput type="number" value={it.counted} onChange={(e) => setCountedVal(idx, e.target.value)} style={{ width: 90 }} /></td><td style={{ fontFamily: "var(--font-mono)", color: diff === 0 ? "var(--ink-soft)" : diff > 0 ? "var(--limon)" : "var(--stamp)" }}>{diff > 0 ? "+" + diff : diff}</td></tr>);
              })}
            </tbody>
          </table>
        </div>
        <div className="flex flex-wrap gap-2 mt-4">
          <Btn variant="ghost" onClick={onCancel}>Cancelar</Btn>
          <Btn variant="ghost" onClick={() => onSave(false)}>Guardar solo el registro</Btn>
          <Btn variant="stamp" onClick={() => onSave(true)}><Check size={16} />Guardar y ajustar inventario ({diffs.length})</Btn>
        </div>
      </div>
    );
  }
  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <h2 style={{ fontFamily: "var(--font-display)" }} className="text-2xl">Conteo de inventario</h2>
        <Btn variant="stamp" onClick={onStart}><Plus size={16} />Nuevo conteo</Btn>
      </div>
      {counts.length === 0 ? <Empty text="No has hecho ningún conteo de inventario todavía." cta="Iniciar primer conteo" onClick={onStart} /> : (
        <div className="flex flex-col gap-2">
          {counts.map((c) => {
            const diffs = c.items.filter((i) => i.diff !== 0);
            return (
              <details key={c.id} className="rounded-lg p-3" style={{ background: "var(--cream)", border: "1px solid var(--kraft-dark)" }}>
                <summary className="cursor-pointer text-sm">{c.date} — {diffs.length} diferencias {c.note ? "· " + c.note : ""}</summary>
                <table className="ledger w-full mt-2"><thead><tr><th>Producto</th><th>Sistema</th><th>Contado</th><th>Diferencia</th></tr></thead>
                  <tbody>{c.items.map((it, idx) => (<tr key={idx}><td>{it.name}</td><td>{it.expected}</td><td>{it.counted}</td><td style={{ color: it.diff === 0 ? "inherit" : it.diff > 0 ? "var(--limon)" : "var(--stamp)" }}>{it.diff > 0 ? "+" + it.diff : it.diff}</td></tr>))}</tbody>
                </table>
              </details>
            );
          })}
        </div>
      )}
    </div>
  );
}

function SimpleLineChart({ data, series }) {
  const w = 600, h = 260, padL = 40, padR = 10, padT = 10, padB = 36;
  const max = Math.max(1, ...data.flatMap((d) => series.map((s) => Number(d[s.key]) || 0)));
  const stepX = data.length > 1 ? (w - padL - padR) / (data.length - 1) : 0;
  const scaleY = (v) => h - padB - (v / max) * (h - padT - padB);
  const scaleX = (i) => padL + i * stepX;
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => Math.round(max * f));
  return (
    <div style={{ width: "100%" }}>
      <svg viewBox={"0 0 " + w + " " + h} style={{ width: "100%", height: 260 }}>
        {ticks.map((t, i) => (
          <g key={i}>
            <line x1={padL} x2={w - padR} y1={scaleY(t)} y2={scaleY(t)} stroke="var(--kraft-dark)" strokeDasharray="3 3" />
            <text x={padL - 6} y={scaleY(t)} fontSize="10" fill="var(--ink-soft)" textAnchor="end" dominantBaseline="middle">{t}</text>
          </g>
        ))}
        {data.map((d, i) => (
          <text key={i} x={scaleX(i)} y={h - padB + 16} fontSize="10" fill="var(--ink-soft)" textAnchor="middle">{d.label}</text>
        ))}
        {series.map((s) => (
          <polyline key={s.key} fill="none" stroke={s.color} strokeWidth="2"
            points={data.map((d, i) => scaleX(i) + "," + scaleY(Number(d[s.key]) || 0)).join(" ")} />
        ))}
        {series.map((s) => data.map((d, i) => (
          <circle key={s.key + i} cx={scaleX(i)} cy={scaleY(Number(d[s.key]) || 0)} r="3" fill={s.color} />
        )))}
      </svg>
      <div className="flex gap-4 justify-center mt-1">
        {series.map((s) => (
          <span key={s.key} className="text-xs flex items-center gap-1"><span style={{ width: 10, height: 10, background: s.color, borderRadius: 2, display: "inline-block" }} />{s.label}</span>
        ))}
      </div>
    </div>
  );
}

function SimpleBarChart({ data, valueKey, labelKey, color, formatValue }) {
  const max = Math.max(1, ...data.map((d) => Number(d[valueKey]) || 0));
  return (
    <div className="flex flex-col gap-3" style={{ paddingTop: 8 }}>
      {data.map((d, i) => {
        const pct = Math.max(2, (Number(d[valueKey]) || 0) / max * 100);
        return (
          <div key={i}>
            <div className="flex justify-between text-xs mb-1"><span>{d[labelKey]}</span><span style={{ fontFamily: "var(--font-mono)" }}>{formatValue ? formatValue(d[valueKey]) : d[valueKey]}</span></div>
            <div style={{ background: "var(--kraft)", borderRadius: 4, height: 10, width: "100%" }}>
              <div style={{ background: color, width: pct + "%", height: "100%", borderRadius: 4 }} />
            </div>
          </div>
        );
      })}
    </div>
  );
}

async function resizeImageFile(file, maxDim = 320, quality = 0.65) {
  const dataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
      else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

function QtyStepper({ value, onChange, min = 1, max }) {
  const dec = () => onChange(Math.max(min, num(value) - 1));
  const inc = () => onChange(max != null ? Math.min(max, num(value) + 1) : num(value) + 1);
  return (
    <div className="flex items-center gap-1">
      <button type="button" onClick={dec} className="w-7 h-7 flex items-center justify-center rounded-md" style={{ border: "1px solid var(--kraft-dark)", background: "var(--cream)" }}><Minus size={13} /></button>
      <TextInput type="number" min={min} max={max} value={value} onChange={(e) => onChange(e.target.value)} style={{ width: 56, textAlign: "center", padding: "6px 4px" }} />
      <button type="button" onClick={inc} className="w-7 h-7 flex items-center justify-center rounded-md" style={{ border: "1px solid var(--kraft-dark)", background: "var(--cream)" }}><Plus size={13} /></button>
    </div>
  );
}
